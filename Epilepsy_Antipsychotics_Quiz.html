<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>חידון אפילפסיה ואנטי־פסיכוטיות</title>

  <style>
    :root{
      --bg:#07111f;
      --card:#101f34;
      --text:#f7fbff;
      --muted:#a8bad0;
      --blue:#55c7ff;
      --gold:#ffbd59;
      --green:#2ecc71;
      --red:#ff6672;
      --border:rgba(255,255,255,.12);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 10%,rgba(85,199,255,.12),transparent 28%),
        radial-gradient(circle at 90% 90%,rgba(255,189,89,.10),transparent 28%),
        var(--bg);
    }

    .app{
      max-width:950px;
      margin:auto;
      padding:78px 20px 24px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      margin-bottom:16px;
    }

    .brand{
      font-weight:900;
      font-size:18px;
    }

    .score{
      color:var(--muted);
      font-weight:700;
    }

    .progress{
      height:10px;
      background:#081522;
      border-radius:999px;
      overflow:hidden;
      margin-bottom:18px;
    }

    .progress > div{
      height:100%;
      width:0;
      background:linear-gradient(90deg,var(--blue),var(--gold));
      transition:.35s;
    }

    .slide{
      min-height:620px;
      background:linear-gradient(145deg,rgba(16,31,52,.98),rgba(11,24,41,.98));
      border:1px solid var(--border);
      border-radius:28px;
      padding:clamp(22px,5vw,46px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      box-shadow:0 24px 70px rgba(0,0,0,.35);
    }

    .kicker{
      color:var(--gold);
      font-weight:900;
      margin-bottom:12px;
    }

    h1{
      font-size:clamp(25px,4vw,40px);
      line-height:1.45;
      margin:0 0 25px;
    }

    .start,
    .finish{
      text-align:center;
    }

    .start p,
    .finish p{
      color:var(--muted);
      font-size:18px;
      line-height:1.8;
    }

    .options{
      display:grid;
      gap:13px;
    }

    .option{
      border:1px solid var(--border);
      background:#0b192b;
      color:var(--text);
      padding:16px 18px;
      border-radius:15px;
      text-align:right;
      font-size:17px;
      line-height:1.55;
      cursor:pointer;
      transition:.2s;
    }

    .option:hover:not(:disabled){
      transform:translateY(-2px);
      border-color:var(--blue);
      background:#10223b;
    }

    .option.correct{
      border-color:var(--green);
      background:rgba(46,204,113,.17);
    }

    .option.wrong{
      border-color:var(--red);
      background:rgba(255,102,114,.17);
    }

    .option:disabled{
      cursor:default;
    }

    .feedback{
      display:none;
      margin-top:22px;
      border-radius:18px;
      padding:18px 20px;
      line-height:1.7;
      background:rgba(255,255,255,.06);
      border:1px solid var(--border);
    }

    .feedback strong{
      display:block;
      font-size:19px;
      margin-bottom:5px;
    }

    .actions{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-top:22px;
      flex-wrap:wrap;
    }

    button.ctrl{
      border:0;
      border-radius:13px;
      padding:13px 19px;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
      transition:.2s;
    }

    button.ctrl:hover:not(:disabled){
      transform:translateY(-2px);
    }

    .primary{
      background:var(--blue);
      color:#06111e;
    }

    .secondary{
      background:#162a45;
      color:var(--text);
      border:1px solid var(--border) !important;
    }

    button.ctrl:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .big-score{
      font-size:76px;
      font-weight:950;
      color:var(--gold);
      margin:12px 0;
    }

.menu-home{
  position:fixed;
  left:18px;
  bottom:18px;
  z-index:9999;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:11px 15px;
  border-radius:12px;
  background:#162a45;
  color:#f7fbff;
  border:1px solid rgba(255,255,255,.16);
  text-decoration:none;
  font-family:Arial,sans-serif;
  font-weight:800;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.menu-home:hover{transform:translateY(-2px)}
@media(max-width:600px){.menu-home{left:10px;bottom:10px;padding:9px 12px;font-size:14px}}
  </style>
</head>

<body>
  <a class="menu-home" href="index.html">← חזרה לתפריט</a>

<div class="app">
<div class="topbar"><div class="brand">אפילפסיה ואנטי־פסיכוטיות</div><div class="score" id="scoreText">מוכן להתחלה</div></div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <main class="slide" id="slide"></main>
  </div>

  <script>
const originalQuestions=[{"q":"כיצד מוגדרת מחלת האפילפסיה על פי חומר הלימוד?","options":["מצב זמני של אובדן הכרה הנובע מחוסר אספקת חמצן תקינה למוח","הפרעה נוירולוגית כרונית המתאפיינת בנטייה להתקפים חוזרים שאינם נגרמים מגורם זמני ידוע","מחלה זיהומית הפוגעת בתאי העצב וגורמת לרעידות בלתי רצוניות בגפיים","חוסר איזון כימי זמני בדם הגורם להפרעה בתפקוד השרירים"],"answer":1,"explanation":"אפילפסיה היא הפרעה נוירולוגית כרונית המתאפיינת בנטייה להתקפים חוזרים שאינם נגרמים מגורם זמני ידוע."},{"q":"מהו המנגנון הפיזיולוגי העומד בבסיס התרחשותו של התקף אפילפטי?","options":["ירידה חדה ברמת הסוכר בדם הגורמת להפסקת התקשורת בין הנוירונים","חסימה של כלי דם במוח המונעת מעבר של אותות חשמליים תקינים","תגובה אלרגית של מערכת החיסון נגד מעטפת תאי העצב","חוסר איזון בין תאי עצב מעוררים למעכבים המוביל להתפרצות חשמלית חריגה"],"answer":3,"explanation":"התקף אפילפטי נובע מחוסר איזון בין פעילות עצבית מעוררת ומעכבת, הגורם להתפרצות חשמלית חריגה."},{"q":"מהו ההבדל המרכזי בין התקפים מוקדיים להתקפים כלליים?","options":["התקפים כלליים ניתנים לטיפול תרופתי בלבד, בעוד התקפים מוקדיים מחייבים ניתוח","בהתקפים מוקדיים יש תמיד אובדן הכרה, ובהתקפים כלליים המטופל נשאר ערני","התקפים מוקדיים מתחילים באזור ספציפי במוח, בעוד התקפים כלליים מערבים את שני צדי המוח מלכתחילה","התקפים מוקדיים נגרמים רק מחבלת ראש, בעוד התקפים כלליים תמיד גנטיים"],"answer":2,"explanation":"התקף מוקדי מתחיל באזור מוגדר במוח, בעוד התקף כללי מערב את שתי ההמיספרות כבר מתחילתו."},{"q":"בעת מתן עזרה ראשונה לאדם החווה התקף, איזו פעולה נחשבת שגויה ומסוכנת?","options":["רישום זמן תחילת ההתקף ומשכו","הנחת משהו רך מתחת לראשו","ניסיון לרסן את תנועותיו או להכניס חפץ לפיו","הזזת חפצים חדים ומסוכנים מסביבתו"],"answer":2,"explanation":"אסור לרסן את האדם או להכניס דבר לפיו. יש להגן על הראש, להרחיק סכנות ולמדוד את משך ההתקף."},{"q":"מה מאפיין את השלב הפוסט־איקטלי לאחר סיום הפרכוסים?","options":["הופעת ריחות חזקים והזיות ראייה","ערנות מוגברת ותחושת אופוריה","חזרה מיידית לתפקוד מלא","בלבול, תשישות וצורך בשינה עמוקה"],"answer":3,"explanation":"בשלב הפוסט־איקטלי שכיחים בלבול, עייפות, תשישות ולעיתים צורך בשינה עמוקה."},{"q":"איזו בדיקה נחשבת מרכזית ביותר באבחון פעילות חשמלית חריגה במוח?","options":["EEG","CT ראש","MRI מוח","בדיקת אלקטרוליטים בדם"],"answer":0,"explanation":"EEG מודד את הפעילות החשמלית במוח ולכן הוא בדיקה מרכזית באבחון אפילפסיה."},{"q":"מהי מטרת העל של הטיפול התרופתי באפילפסיה ומהי הצלחתו הסטטיסטית?","options":["ריפוי מלא של המחלה; כ־30% מצליחים בכך","שינוי במבנה הפיזי של המוח; כ־50% מצליחים בכך","השגת איזון ומניעת התקפים; כ־70% מגיבים לטיפול","הפחתת תופעות הלוואי בלבד; כ־90% מגיבים"],"answer":2,"explanation":"המטרה היא להשיג איזון ולמנוע התקפים, וכ־70% מהמטופלים מגיבים היטב לטיפול תרופתי."},{"q":"מדוע חשוב להתחיל טיפול לאחר הופעת התקף שני?","options":["כי הסיכון להתקף שלישי לאחר התקף שני עולה לכ־70%","כי הביטוח אינו מכסה טיפול לאחר התקף אחד","כי התרופות פועלות טוב יותר רק לאחר ההתקף השני","כי התקף שני גורם בהכרח לנזק בלתי הפיך"],"answer":0,"explanation":"לאחר התקף שני הסיכון להישנות נוספת עולה משמעותית, ולכן יש הצדקה חזקה להתחיל טיפול."},{"q":"מהם המאפיינים התזונתיים של דיאטה קטוגנית המשמשת לטיפול באפילפסיה עמידה?","options":["תזונה עשירה בחלבון וללא שומן","תזונה עשירה מאוד בשומן ודלה מאוד בפחמימות","צום לסירוגין ללא הגבלת סוגי מזון","תזונה המבוססת רק על פירות וירקות"],"answer":1,"explanation":"דיאטה קטוגנית עשירה מאוד בשומן ודלה מאוד בפחמימות, ולעיתים משמשת באפילפסיה עמידה."},{"q":"איזה גורם משפיע על התאמת התרופה האנטי־אפילפטית למטופל?","options":["התרופה שעבדה למטופל אחר","סוג האפילפסיה, גיל ומין המטופל ומחלות רקע נוספות","סוג הדם והגובה בלבד","מספר האחים והרגלי התזונה"],"answer":1,"explanation":"בחירת התרופה נעשית לפי סוג האפילפסיה וההתקפים, גיל, מין, מחלות רקע ושיקולים אישיים נוספים."},{"q":"מה הייתה התרופה האנטי־פסיכוטית הראשונה שניתנה לבני אדם, ובאיזו שנה?","options":["Chlorpromazine בשנת 1952","Clozapine בשנת 1952","Lithium בשנת 1948","Haloperidol בשנת 1960"],"answer":0,"explanation":"Chlorpromazine נחשבת לתרופה האנטי־פסיכוטית הראשונה שניתנה לבני אדם בשנת 1952."},{"q":"על פי המודל הדופמינרגי, מה גורם להופעת תסמינים חיוביים כמו הזיות ומחשבות שווא?","options":["חוסר בדופמין במוח","עודף פעילות דופמינרגית במוח","ירידה ברמות האדרנלין","עודף סרוטונין בלבד"],"answer":1,"explanation":"תסמינים חיוביים כמו הזיות ומחשבות שווא מקושרים לעודף פעילות דופמינרגית."},{"q":"מהו ההבדל העיקרי במנגנון הפעולה בין תרופות טיפיות לא־טיפיות?","options":["תרופות א־טיפיות חוסמות גם קולטני סרוטונין בנוסף לקולטני דופמין","תרופות טיפיות חוסמות רק קולטני אדרנלין","תרופות א־טיפיות אינן חוסמות דופמין כלל","תרופות טיפיות פועלות רק במערכת העיכול"],"answer":0,"explanation":"תרופות א־טיפיות פועלות בדרך כלל גם על קולטני סרוטונין וגם על קולטני דופמין."},{"q":"איזו תרופה נחשבת יעילה מאוד אך עלולה לגרום לאגרנולוציטוזיס?","options":["Sulpiride","Clozapine","Risperidone","Haloperidol"],"answer":1,"explanation":"Clozapine עלולה לגרום לאגרנולוציטוזיס ולכן דורשת מעקב אחר ספירת דם."},{"q":"באילו תרופות שכיחות יותר תופעות לוואי מטבוליות כמו עלייה במשקל וסיכון מוגבר לסוכרת?","options":["תרופות אנטי־היסטמיניות","תרופות אנטי־פסיכוטיות א־טיפיות מהדור השני","בכל התרופות באותה מידה","תרופות אנטי־פסיכוטיות טיפיות מהדור הראשון"],"answer":1,"explanation":"תופעות מטבוליות כמו עלייה במשקל, היפרגליקמיה וסיכון לסוכרת שכיחות יותר בתרופות א־טיפיות מסוימות."},{"q":"מהי אקטיזיה (Akathisia)?","options":["התכווצות שרירים בלתי רצונית וכואבת","תנועות בלתי רצוניות של הפה והלשון","רעד בידיים הדומה למחלת פרקינסון","צורך מתמיד לנוע וחוסר שקט גופני"],"answer":3,"explanation":"אקטיזיה היא תחושת אי־שקט עם צורך מתמיד לזוז, לקום או ללכת."},{"q":"תוך כמה זמן ניתן בדרך כלל לצפות לתגובה טיפולית מלאה של תרופות אנטי־פסיכוטיות?","options":["מספר שעות","4–6 שבועות","24 שעות בדיוק","חצי שעה"],"answer":1,"explanation":"תגובה טיפולית מלאה לרוב דורשת 4–6 שבועות."},{"q":"מה נכלל בתסמינים שליליים של מחלות פסיכוטיות?","options":["הזיות שמיעה וראייה","מחשבות שווא ופרנויה","אנהדוניה וירידה במוטיבציה","התנהגות תוקפנית ואגיטציה"],"answer":2,"explanation":"תסמינים שליליים כוללים אנהדוניה, ירידה במוטיבציה והפחתה בתפקוד ובהבעה הרגשית."},{"q":"מדוע יש לבצע ECG לפני תחילת טיפול אנטי־פסיכוטי ובאופן תקופתי במהלכו?","options":["כדי לאבחן אפילפסיה","בגלל סיכון להפרעות בהולכה ובקצב הלב","כדי למנוע דלקת ריאות","כדי לבדוק את רמת הכולסטרול"],"answer":1,"explanation":"חלק מהתרופות עלולות לגרום להארכת QT ולהפרעות קצב, ולכן מבצעים מעקב לבבי."},{"q":"מה עלול לקרות כתוצאה מהפסקה פתאומית של טיפול אנטי־פסיכוטי ללא הוראת רופא?","options":["צמיחת שיער מוגברת","שיפור מיידי ביכולת הריכוז","תסמיני גמילה כמו נדודי שינה, סיוטים ובחילות","אובדן תיאבון קבוע"],"answer":2,"explanation":"הפסקה פתאומית עלולה לגרום לתסמיני גמילה ולהחמרה או חזרה של התסמינים, ולכן מפסיקים בהדרגה ובהוראת רופא."}];
    let questions = [];
    let index = 0;
    let score = 0;
    let answered = false;

    const slide = document.getElementById("slide");
    const scoreText = document.getElementById("scoreText");
    const progressBar = document.getElementById("progressBar");

    function shuffle(array){
      for(let i = array.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function startQuiz(){
      questions = JSON.parse(JSON.stringify(originalQuestions));
      shuffle(questions);

      questions.forEach((question) => {
        const correctAnswer = question.options[question.answer];
        shuffle(question.options);
        question.answer = question.options.indexOf(correctAnswer);
      });

      index = 0;
      score = 0;
      answered = false;

      renderQuestion();
    }

    function renderStart(){
      progressBar.style.width = "0%";
      scoreText.textContent = "מוכן להתחלה";

      slide.innerHTML = `
        <section class="start">
          <div class="kicker">תרגול אינטראקטיבי</div>
          <h1>אפילפסיה ותרופות אנטי־פסיכוטיות</h1>
          <p>עשרים שאלות עם משוב והסבר לאחר כל תשובה.</p>
          <button class="ctrl primary" onclick="startQuiz()">התחלת התרגול</button>
        </section>
      `;
    }

    function renderQuestion(){
      answered = false;

      const question = questions[index];
      const letters = ["א", "ב", "ג", "ד"];

      scoreText.textContent = `שאלה ${index + 1} מתוך ${questions.length} | ציון: ${score}`;
      progressBar.style.width = `${(index / questions.length) * 100}%`;

      slide.innerHTML = `
        <div class="kicker">שאלה ${index + 1} מתוך ${questions.length}</div>
        <h1>${question.q}</h1>

        <div class="options">
          ${question.options.map((option, optionIndex) => `
            <button class="option" onclick="answer(${optionIndex})">
              ${letters[optionIndex]}. ${option}
            </button>
          `).join("")}
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="actions">
          <button class="ctrl secondary" onclick="renderStart()">התחלה מחדש</button>
          <button class="ctrl primary" id="nextBtn" onclick="nextQuestion()" disabled>
            לשאלה הבאה
          </button>
        </div>
      `;
    }

    function answer(choice){
      if(answered) return;

      answered = true;

      const question = questions[index];
      const optionButtons = [...document.querySelectorAll(".option")];
      const feedback = document.getElementById("feedback");
      const nextButton = document.getElementById("nextBtn");

      optionButtons.forEach((button, buttonIndex) => {
        button.disabled = true;

        if(buttonIndex === question.answer){
          button.classList.add("correct");
        }
      });

      const isCorrect = choice === question.answer;

      if(isCorrect){
        score++;
      }else{
        optionButtons[choice].classList.add("wrong");
      }

      feedback.style.display = "block";
      feedback.innerHTML = `
        <strong>${isCorrect ? "נכון מאוד!" : "לא נכון"}</strong>
        ${question.explanation}
      `;

      nextButton.disabled = false;

      scoreText.textContent = `שאלה ${index + 1} מתוך ${questions.length} | ציון: ${score}`;
      progressBar.style.width = `${((index + 1) / questions.length) * 100}%`;
    }

    function nextQuestion(){
      if(!answered) return;

      index++;

      if(index >= questions.length){
        renderFinish();
      }else{
        renderQuestion();
      }
    }

    function renderFinish(){
      scoreText.textContent = "התרגול הסתיים";
      progressBar.style.width = "100%";

      slide.innerHTML = `
        <section class="finish">
          <div class="kicker">סיום התרגול</div>
          <h1>כל הכבוד!</h1>
          <div class="big-score">${score}/${questions.length}</div>
          <p>אפשר להתחיל שוב ולקבל סדר שאלות ותשובות חדש.</p>
          <button class="ctrl primary" onclick="startQuiz()">תרגול חדש</button>
        </section>
      `;
    }
    
document.addEventListener("keydown", function(e) {
  if (e.repeat) return;

  // Backspace = الرجوع للصفحة الرئيسية
  if (e.key === "Backspace") {
    e.preventDefault();
    window.location.href = "index.html";
    return;
  }

  // إذا انتهى الامتحان → Enter يبدأ امتحان جديد
  if (index >= questions.length) {
    if (e.key === "Enter") {
      startQuiz();
    }
    return;
  }

  // أثناء السؤال → 1-4 لاختيار الإجابة
  if (!answered) {
    if (e.key === "1") answer(0);
    else if (e.key === "2") answer(1);
    else if (e.key === "3") answer(2);
    else if (e.key === "4") answer(3);
  }

  // بعد الإجابة → Enter للسؤال التالي
  else if (e.key === "Enter") {
    nextQuestion();
  }
});


    renderStart();
  </script>
