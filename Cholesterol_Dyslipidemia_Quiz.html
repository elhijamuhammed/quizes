<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>דיסליפידמיה, כולסטרול וטיפול תרופתי</title><style>
:root{--bg:#07111f;--card:#101f34;--text:#f7fbff;--muted:#a8bad0;--blue:#55c7ff;--gold:#ffbd59;--green:#2ecc71;--red:#ff6672;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:var(--bg)}.app{max-width:950px;margin:auto;padding:78px 20px 24px}.topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.brand{font-weight:900}.score{color:var(--muted);font-weight:700}.progress{height:10px;background:#081522;border-radius:999px;overflow:hidden;margin-bottom:18px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:.35s}.slide{min-height:620px;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:clamp(22px,5vw,46px);display:flex;flex-direction:column;justify-content:center}.kicker{color:var(--gold);font-weight:900;margin-bottom:12px}h1{font-size:clamp(25px,4vw,40px);line-height:1.45;margin:0 0 25px}.start,.finish{text-align:center}.start p,.finish p{color:var(--muted);font-size:18px;line-height:1.8}.options{display:grid;gap:13px}.option{border:1px solid var(--border);background:#0b192b;color:var(--text);padding:16px 18px;border-radius:15px;text-align:right;font-size:17px;cursor:pointer}.option.correct{border-color:var(--green);background:rgba(46,204,113,.17)}.option.wrong{border-color:var(--red);background:rgba(255,102,114,.17)}.feedback{display:none;margin-top:22px;border-radius:18px;padding:18px 20px;line-height:1.7;background:rgba(255,255,255,.06);border:1px solid var(--border)}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}button.ctrl{border:0;border-radius:13px;padding:13px 19px;font-size:16px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#06111e}.secondary{background:#162a45;color:var(--text)}button:disabled{opacity:.45}.big-score{font-size:76px;font-weight:950;color:var(--gold)}.menu-home{position:fixed;top:18px;left:18px;padding:12px 17px;border-radius:13px;background:#162a45;color:#fff;text-decoration:none;font-weight:900}@media(max-width:600px){.app{padding:68px 10px 10px}.slide{min-height:calc(100vh - 115px);border-radius:20px;padding:20px}}
</style></head><body><a class="menu-home" href="index.html">← חזרה לתפריט</a><div class="app"><div class="topbar"><div class="brand">דיסליפידמיה וכולסטרול</div><div class="score" id="scoreText">מוכן להתחלה</div></div><div class="progress"><div id="progressBar"></div></div><main class="slide" id="slide"></main></div><script>
const originalQuestions=[{"q": "מהי דיסליפידמיה?", "options": ["חריגה מהטווח התקין של אחד או יותר מסוגי השומנים בדם", "ירידה בלבד ברמת הגלוקוז בדם", "עלייה בלבד בלחץ הדם", "חסר בברזל"], "answer": 0, "explanation": "דיסליפידמיה היא הפרעה ברמות שומני הדם, כגון LDL גבוה, HDL נמוך, טריגליצרידים גבוהים או שילוב שלהם."}, {"q": "איזה שינוי בשומני הדם נחשב גורם אופייני לדיסליפידמיה?", "options": ["LDL גבוה", "HDL גבוה בלבד", "LDL נמוך בלבד", "ויטמין D גבוה"], "answer": 0, "explanation": "המצגת מציינת LDL גבוה, HDL נמוך וטריגליצרידים גבוהים כשינויים אופייניים בדיסליפידמיה."}, {"q": "איזה שלב מרכזי מתרחש בהתפתחות טרשת עורקים?", "options": ["חדירת LDL לדופן העורק והתחמצנותו", "פירוק מוחלט של HDL בכבד", "ירידה במספר הטסיות", "עלייה בייצור המוגלובין"], "answer": 0, "explanation": "לאחר פגיעה באנדותל, LDL חודר לדופן ומתחמצן, ובהמשך נוצרים תאי קצף ופס שומני."}, {"q": "קרע בפלאק טרשתי עלול לגרום ל־", "options": ["מחלת לב איסכמית, אירוע מוחי איסכמי או מחלת כלי דם פריפריים", "רק לאנמיה", "רק לאסתמה", "רק לתת־פעילות של בלוטת התריס"], "answer": 0, "explanation": "המצגת קושרת קרע בפלאק טרשתי למחלת לב איסכמית, שבץ איסכמי ומחלת כלי דם פריפריים."}, {"q": "מהו תפקיד חשוב של כולסטרול בגוף?", "options": ["מרכיב בממברנות התאים וחומר מוצא להורמונים סטרואידיים, חומצות מרה וויטמין D", "ייצור ישיר של אינסולין בלבד", "פירוק חלבונים במעי", "יצירת תאי דם לבנים בלבד"], "answer": 0, "explanation": "כולסטרול חיוני ליציבות ממברנות התאים ומשמש חומר מוצא להורמונים סטרואידיים, חומצות מרה וויטמין D."}, {"q": "היכן מתבצעת בעיקר הסינתזה האנדוגנית של כולסטרול?", "options": ["בכבד", "בריאות", "בטחול בלבד", "בעור בלבד"], "answer": 0, "explanation": "המקור האנדוגני של כולסטרול הוא בעיקר סינתזה בכבד, וגם במעי וברקמות נוספות."}, {"q": "מהו תפקידו העיקרי של LDL לפי המצגת?", "options": ["נשיאת כולסטרול מהכבד ורקמות מרכזיות אל רקמות היקפיות", "החזרת כולסטרול מהפריפריה אל הכבד", "פירוק קרישי דם", "הובלת חמצן"], "answer": 0, "explanation": "LDL מעביר כולסטרול בעיקר מהכבד אל הרקמות ההיקפיות."}, {"q": "מהו תפקידו העיקרי של HDL?", "options": ["להחזיר כולסטרול מהפריפריה אל הכבד", "להוביל כולסטרול מהכבד אל הפריפריה", "להעלות טריגליצרידים", "לעכב ספיגת ברזל"], "answer": 0, "explanation": "HDL מתואר במצגת כ'משאית הזבל' של הכולסטרול, המחזירה כולסטרול מהפריפריה אל הכבד."}, {"q": "באילו ליפופרוטאינים נישאים בעיקר טריגליצרידים?", "options": ["VLDL וכילומיקרונים", "HDL בלבד", "LDL בלבד", "אלבומין בלבד"], "answer": 0, "explanation": "המצגת מציינת שטריגליצרידים נישאים בעיקר על ידי VLDL וכילומיקרונים."}, {"q": "מהו סיכון חשוב של טריגליצרידים גבוהים?", "options": ["פנקראטיטיס חריפה ומחלות לב", "אוסטאופורוזיס בלבד", "היפוגליקמיה בלבד", "דלקת גרון בלבד"], "answer": 0, "explanation": "טריגליצרידים גבוהים קשורים לסיכון לפנקראטיטיס חריפה ולמחלות לב."}, {"q": "ככל שמורידים את רמת ה־LDL, מה קורה לפי המצגת?", "options": ["יורדות התחלואה והתמותה", "עולה בהכרח הסיכון לשבץ", "אין שום שינוי קליני", "עולה תמיד רמת הטריגליצרידים"], "answer": 0, "explanation": "המצגת מדגישה קשר בין הפחתת LDL לבין ירידה בתחלואה ובתמותה."}, {"q": "מהו מנגנון הפעולה המרכזי של סטטינים?", "options": ["עיכוב האנזים HMG-CoA reductase", "עיכוב הקולטן P2Y12", "חסימת פקטור Xa", "עיכוב משאבת פרוטונים"], "answer": 0, "explanation": "סטטינים מעכבים HMG-CoA reductase, אנזים מפתח בסינתזת כולסטרול בכבד."}, {"q": "איזו תופעת לוואי שרירית חשובה מחייבת בירור במטופל הנוטל סטטינים?", "options": ["כאבי שרירים, חולשה או חשד לרבדומיוליזיס", "נזלת בלבד", "יובש בעיניים בלבד", "שיעול קל בלבד"], "answer": 0, "explanation": "כאבי שרירים על רקע סטטינים יכולים להתבטא בכאב, התכווצויות או חולשה, ויש לברר מחשש לרבדומיוליזיס."}, {"q": "מהי השלישייה הקלאסית המתוארת ברבדומיוליזיס?", "options": ["כאבי שרירים מפושטים, חולשה ושתן כהה", "חום, שיעול ונזלת", "כאבי בטן, שלשול והקאה", "צמא, רעב והשתנה מרובה"], "answer": 0, "explanation": "המצגת מתארת כאבי שרירים מפושטים, חולשה ושתן כהה (מיוגלובינוריה) כשלישייה קלאסית, שאינה תמיד קיימת."}, {"q": "מהו מנגנון הפעולה של Ezetimibe?", "options": ["עיכוב ספיגת כולסטרול במעי דרך הטרנספורטר NPC1L1", "עיכוב HMG-CoA reductase", "הפעלת PPAR-α", "עיכוב ישיר של PCSK9 בזריקה"], "answer": 0, "explanation": "Ezetimibe מעכב את ספיגת הכולסטרול במעי באמצעות עיכוב הטרנספורטר NPC1L1."}, {"q": "מהו מנגנון הפעולה של פיבראטים לפי המצגת?", "options": ["הפעלת PPAR-α והשפעה על ביטוי גנים במטבוליזם של שומנים", "חסימת P2Y12", "עיכוב NPC1L1", "עיכוב ישיר של תרומבין"], "answer": 0, "explanation": "פיבראטים מפעילים את PPAR-α, מגבירים פירוק ליפופרוטאינים עשירים בטריגליצרידים ומפחיתים סינתזת טריגליצרידים בכבד."}, {"q": "מתי מומלץ לשקול הוספת פיבראט לסטטין לפי המצגת?", "options": ["כאשר TG מעל 500 מ\"ג/ד\"ל או כשהסטטין אינו נסבל", "כאשר HDL מעל 100", "בכל מטופל ללא קשר ל-TG", "רק כש-LDL נמוך מאוד"], "answer": 0, "explanation": "המצגת מציינת לשקול פיבראט כאשר TG מעל 500 מ\"ג/ד\"ל או כשהסטטין אינו נסבל."}, {"q": "מה מאפיין מעכבי PCSK9 כגון Repatha ו-Praluent?", "options": ["הפחתה משמעותית של LDL, עד כ־60% לפי המצגת", "העלאה משמעותית של LDL", "שימוש רק לטיפול בכאב", "עיכוב ספיגת ברזל"], "answer": 0, "explanation": "מעכבי PCSK9 מתוארים כתרופות יעילות מאוד, עם הפחתה של עד כ־60% ברמות LDL."}, {"q": "למי מיועדים מעכבי PCSK9 לפי המצגת?", "options": ["למניעה שניונית כשסטטין ואזטימיב אינם מספיקים, או בהיפרכולסטרולמיה משפחתית לא מאוזנת", "לכל אדם עם HDL גבוה", "רק לטיפול בטריגליצרידים נמוכים", "רק לטיפול באנמיה"], "answer": 0, "explanation": "המצגת מציינת שימוש במניעה שניונית כאשר סטטין ואזטימיב אינם משיגים איזון, וכן בהיפרכולסטרולמיה משפחתית עם גורמי סיכון."}, {"q": "כיצד פועלים סופחי חומצות מרה?", "options": ["קושרים חומצות מרה במעי וכך מגבירים יצירה וקולטני LDL בכבד", "חוסמים ישירות את פקטור Xa", "מעכבים PPAR-α", "מפעילים את HMG-CoA reductase"], "answer": 0, "explanation": "סופחי מרה קושרים חומצות מרה במעי, מפחיתים את חזרתן לכבד ומביאים להגברת יצירת חומצות מרה ולעלייה בקולטני LDL בכבד."}];let questions=[],index=0,score=0,answered=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function startQuiz(){questions=JSON.parse(JSON.stringify(originalQuestions));shuffle(questions);questions.forEach(q=>{const c=q.options[q.answer];shuffle(q.options);q.answer=q.options.indexOf(c)});index=0;score=0;renderQuestion()}
function renderStart(){progressBar.style.width='0%';scoreText.textContent='מוכן להתחלה';slide.innerHTML=`<section class="start"><div class="kicker">תרגול אינטראקטיבי</div><h1>דיסליפידמיה, כולסטרול וטיפול תרופתי</h1><p>20 שאלות על LDL, HDL, טריגליצרידים, טרשת עורקים, סטטינים, Ezetimibe, פיבראטים, PCSK9 וטיפולים נוספים.</p><button class="ctrl primary" onclick="startQuiz()">התחלת התרגול</button></section>`}
function renderQuestion(){answered=false;const q=questions[index],L=['א','ב','ג','ד'];scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;progressBar.style.width=`${index/questions.length*100}%`;slide.innerHTML=`<div class="kicker">שאלה ${index+1} מתוך ${questions.length}</div><h1>${q.q}</h1><div class="options">${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${L[i]}. ${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="ctrl secondary" onclick="renderStart()">התחלה מחדש</button><button class="ctrl primary" id="nextBtn" onclick="nextQuestion()" disabled>לשאלה הבאה</button></div>`}
function answer(choice){if(answered)return;answered=true;const q=questions[index],bs=[...document.querySelectorAll('.option')];bs.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct')});const ok=choice===q.answer;if(ok)score++;else bs[choice].classList.add('wrong');feedback.style.display='block';feedback.innerHTML=`<strong>${ok?'נכון מאוד!':'לא נכון'}</strong><br>${q.explanation}`;nextBtn.disabled=false;scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;progressBar.style.width=`${(index+1)/questions.length*100}%`}
function nextQuestion(){index++;index>=questions.length?finish():renderQuestion()}
function finish(){scoreText.textContent='התרגול הסתיים';progressBar.style.width='100%';slide.innerHTML=`<section class="finish"><div class="kicker">סיום התרגול</div><h1>כל הכבוד!</h1><div class="big-score">${score}/${questions.length}</div><button class="ctrl primary" onclick="startQuiz()">תרגול חדש</button></section>`}

document.addEventListener("keydown", function(e) {
  if (e.repeat) return;

  // Backspace = الرجوع للصفحة الرئيسية
  if (e.key === "Backspace") {
    e.preventDefault();
    window.location.href = "index.html";
    return;
  }

  // إذا انتهى الامتحان → Enter يبدأ امتحان جديد
  if (index >= questions.length) {
    if (e.key === "Enter") {
      startQuiz();
    }
    return;
  }

  // أثناء السؤال → 1-4 لاختيار الإجابة
  if (!answered) {
    if (e.key === "1") answer(0);
    else if (e.key === "2") answer(1);
    else if (e.key === "3") answer(2);
    else if (e.key === "4") answer(3);
  }

  // بعد الإجابة → Enter للسؤال التالي
  else if (e.key === "Enter") {
    nextQuestion();
  }
});

renderStart();
</script>
