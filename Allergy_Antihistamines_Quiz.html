<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אלרגיה ואנטיהיסטמינים</title><style>
:root{--bg:#07111f;--card:#101f34;--text:#f7fbff;--muted:#a8bad0;--blue:#55c7ff;--gold:#ffbd59;--green:#2ecc71;--red:#ff6672;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:var(--bg)}.app{max-width:950px;margin:auto;padding:78px 20px 24px}.topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.brand{font-weight:900}.score{color:var(--muted);font-weight:700}.progress{height:10px;background:#081522;border-radius:999px;overflow:hidden;margin-bottom:18px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:.35s}.slide{min-height:620px;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:clamp(22px,5vw,46px);display:flex;flex-direction:column;justify-content:center}.kicker{color:var(--gold);font-weight:900;margin-bottom:12px}h1{font-size:clamp(25px,4vw,40px);line-height:1.45;margin:0 0 25px}.start,.finish{text-align:center}.start p,.finish p{color:var(--muted);font-size:18px;line-height:1.8}.options{display:grid;gap:13px}.option{border:1px solid var(--border);background:#0b192b;color:var(--text);padding:16px 18px;border-radius:15px;text-align:right;font-size:17px;cursor:pointer}.option.correct{border-color:var(--green);background:rgba(46,204,113,.17)}.option.wrong{border-color:var(--red);background:rgba(255,102,114,.17)}.feedback{display:none;margin-top:22px;border-radius:18px;padding:18px 20px;line-height:1.7;background:rgba(255,255,255,.06);border:1px solid var(--border)}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}button.ctrl{border:0;border-radius:13px;padding:13px 19px;font-size:16px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#06111e}.secondary{background:#162a45;color:var(--text)}button:disabled{opacity:.45}.big-score{font-size:76px;font-weight:950;color:var(--gold)}.menu-home{position:fixed;top:18px;left:18px;padding:12px 17px;border-radius:13px;background:#162a45;color:#fff;text-decoration:none;font-weight:900}@media(max-width:600px){.app{padding:68px 10px 10px}.slide{min-height:calc(100vh - 115px);border-radius:20px;padding:20px}}
</style></head><body><a class="menu-home" href="index.html">← חזרה לתפריט</a><div class="app"><div class="topbar"><div class="brand">אלרגיה ואנטיהיסטמינים</div><div class="score" id="scoreText">מוכן להתחלה</div></div><div class="progress"><div id="progressBar"></div></div><main class="slide" id="slide"></main></div><script>
const originalQuestions=[{"q": "איזו קבוצה נחשבת טיפול מרכזי בתסמיני אלרגיה מיידיים?", "options": ["חוסמי H1", "מעכבי COMT", "אגוניסטים ל-D2", "מעכבי SGLT2"], "answer": 0, "explanation": "חוסמי H1 מפחיתים את השפעת ההיסטמין בתגובה האלרגית."}, {"q": "מה מאפיין אנטיהיסטמינים מהדור הראשון?", "options": ["חודרים ל-BBB וגורמים לסדציה", "אינם חודרים למוח כלל", "פועלים רק על לויקוטריאנים", "אינם גורמים לתופעות אנטיכולינרגיות"], "answer": 0, "explanation": "דור ראשון חודר למוח ולכן גורם לעייפות וישנוניות."}, {"q": "איזו תרופה שייכת לדור הראשון של אנטיהיסטמינים?", "options": ["Diphenhydramine", "Cetirizine", "Desloratadine", "Fexofenadine"], "answer": 0, "explanation": "Diphenhydramine היא אנטיהיסטמין מהדור הראשון."}, {"q": "איזו תרופה שייכת לדור השני?", "options": ["Cetirizine", "Promethazine", "Diphenhydramine", "Omalizumab"], "answer": 0, "explanation": "Cetirizine היא מהדור השני ובדרך כלל מרדימה פחות."}, {"q": "איזו תרופה שייכת לדור השלישי לפי המצגת?", "options": ["Desloratadine", "Promethazine", "Montelukast", "Epinephrine"], "answer": 0, "explanation": "Desloratadine מופיעה במצגת כדור שלישי."}, {"q": "מהו מנגנון הפעולה של Montelukast?", "options": ["חסימת רצפטורים ללויקוטריאנים", "חסימת H1", "הפעלת קולטני בטא 2", "חסימת IgE חופשי"], "answer": 0, "explanation": "Montelukast חוסם רצפטורים ללויקוטריאנים ומפחית דלקת וכיווץ בדרכי הנשימה."}, {"q": "מהו שם המסחר המופיע ל-Montelukast?", "options": ["Singulair", "Xolair", "Nucala", "Dupixent"], "answer": 0, "explanation": "Singulair הוא שם מסחרי של Montelukast."}, {"q": "איזו אזהרה חשובה קיימת ב-Montelukast?", "options": ["תופעות נוירופסיכיאטריות", "אי-ספיקת כליות חדה בכל מטופל", "עיוורון לילה", "היפוגליקמיה חמורה"], "answer": 0, "explanation": "המצגת מדגישה שינויים במצב הרוח ותופעות נוירופסיכיאטריות."}, {"q": "מה עושה Mast Cell Stabilizer?", "options": ["מונע דה-גרנולציה ושחרור היסטמין", "מפרק היסטמין שכבר שוחרר", "מפעיל IgE", "מכווץ כלי דם"], "answer": 0, "explanation": "מייצב תאי פיטום מונע שחרור מתווכים כמו היסטמין."}, {"q": "מתי מייצבי תאי פיטום יעילים במיוחד?", "options": ["כטיפול מניעתי לפני חשיפה", "רק לאחר אנפילקסיס קשה", "רק לאחר 24 שעות", "רק יחד עם Levodopa"], "answer": 0, "explanation": "אלה תרופות מניעה, ולכן מתחילים לפני החשיפה."}, {"q": "מהו מנגנון Omalizumab?", "options": ["קשירה ל-IgE חופשי לפני קישורו לתאי פיטום", "חסימת IL-5 בלבד", "חסימת H2", "הפעלת רצפטור NK1"], "answer": 0, "explanation": "Omalizumab הוא נוגדן Anti-IgE."}, {"q": "איזו תרופה ביולוגית חוסמת מסלולי אינטרלוקינים?", "options": ["Dupilumab", "Famotidine", "Ritalin", "Loperamide"], "answer": 0, "explanation": "Dupilumab היא טיפול ביולוגי נגד מסלולי אינטרלוקינים."}, {"q": "איזו תרופה ביולוגית מופיעה נגד IL-5?", "options": ["Mepolizumab", "Cetirizine", "Promethazine", "Montelukast"], "answer": 0, "explanation": "Mepolizumab מופיעה במצגת כחוסמת מסלול IL-5."}, {"q": "מהו הטיפול מציל החיים באנפילקסיס?", "options": ["Epinephrine", "Cetirizine בלבד", "Montelukast", "סטרואיד מקומי"], "answer": 0, "explanation": "אדרנלין הוא טיפול מציל חיים באנפילקסיס."}, {"q": "מהו מנגנון עיקרי של Epinephrine באנפילקסיס?", "options": ["כיווץ כלי דם והרחבת דרכי נשימה", "חסימת H1 בלבד", "דיכוי מח העצם", "חסימת ספיגת ברזל"], "answer": 0, "explanation": "אדרנלין מכווץ כלי דם ומרחיב סימפונות."}, {"q": "האם אנטיהיסטמינים או סטרואידים מחליפים Epinephrine באנפילקסיס?", "options": ["לא", "כן תמיד", "רק בילדים", "רק לאחר אוכל"], "answer": 0, "explanation": "הם יכולים להיות טיפול נוסף, אך אינם תחליף לאדרנלין."}, {"q": "איזו תופעת לוואי אופיינית לחוסמי H1 מהדור הראשון?", "options": ["יובש בפה וישנוניות", "היפרקלמיה", "כשל כבדי בכל שימוש", "הפרשת חלב"], "answer": 0, "explanation": "הדור הראשון גורם לסדציה ולתופעות אנטיכולינרגיות."}, {"q": "למה דור שני מועדף לעיתים על דור ראשון?", "options": ["פחות סדציה ומשך פעולה ארוך יותר", "יותר מעבר BBB", "יותר השפעה אנטיכולינרגית", "אין לו השפעה על אלרגיה"], "answer": 0, "explanation": "הדור השני פחות מרדים ומתאים יותר לשימוש יומיומי."}, {"q": "מה תפקיד קורטיקוסטרואידים באלרגיה?", "options": ["דיכוי דלקת", "חסימת DAT", "העלאת IgE", "הפעלת Mast cells"], "answer": 0, "explanation": "סטרואידים מדכאים את התהליך הדלקתי."}, {"q": "מתי נשקלים טיפולים ביולוגיים באלרגיה?", "options": ["במצבים קשים שלא הגיבו לטיפול רגיל", "בכל נזלת קלה", "רק לפני בדיקת עור", "רק ללא אבחנה"], "answer": 0, "explanation": "המצגת מציגה אותם לטיפול ממוקד במצבים קשים."}];let questions=[],index=0,score=0,answered=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function startQuiz(){questions=JSON.parse(JSON.stringify(originalQuestions));shuffle(questions);questions.forEach(q=>{const c=q.options[q.answer];shuffle(q.options);q.answer=q.options.indexOf(c)});index=0;score=0;renderQuestion()}
function renderStart(){progressBar.style.width='0%';scoreText.textContent='מוכן להתחלה';slide.innerHTML=`<section class="start"><div class="kicker">תרגול אינטראקטיבי</div><h1>אלרגיה ואנטיהיסטמינים</h1><p>20 שאלות ממוקדות בתרופות, מנגנוני פעולה, שימושים ואזהרות.</p><button class="ctrl primary" onclick="startQuiz()">התחלת התרגול</button></section>`}
function renderQuestion(){answered=false;const q=questions[index],L=['א','ב','ג','ד'];scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;progressBar.style.width=`${index/questions.length*100}%`;slide.innerHTML=`<div class="kicker">שאלה ${index+1} מתוך ${questions.length}</div><h1>${q.q}</h1><div class="options">${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${L[i]}. ${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="ctrl secondary" onclick="renderStart()">התחלה מחדש</button><button class="ctrl primary" id="nextBtn" onclick="nextQuestion()" disabled>לשאלה הבאה</button></div>`}
function answer(choice){if(answered)return;answered=true;const q=questions[index],bs=[...document.querySelectorAll('.option')];bs.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct')});const ok=choice===q.answer;if(ok)score++;else bs[choice].classList.add('wrong');feedback.style.display='block';feedback.innerHTML=`<strong>${ok?'נכון מאוד!':'לא נכון'}</strong><br>${q.explanation}`;nextBtn.disabled=false;scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;progressBar.style.width=`${(index+1)/questions.length*100}%`}
function nextQuestion(){index++;index>=questions.length?finish():renderQuestion()}
function finish(){scoreText.textContent='התרגול הסתיים';progressBar.style.width='100%';slide.innerHTML=`<section class="finish"><div class="kicker">סיום התרגול</div><h1>כל הכבוד!</h1><div class="big-score">${score}/${questions.length}</div><button class="ctrl primary" onclick="startQuiz()">תרגול חדש</button></section>`}renderStart();
</script></body></html>
