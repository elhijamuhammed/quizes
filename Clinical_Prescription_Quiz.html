<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>חידון המרשם הקליני</title>
<style>
:root{--bg:#07111f;--card:#101f34;--text:#f7fbff;--muted:#a8bad0;--blue:#55c7ff;--gold:#ffbd59;--green:#2ecc71;--red:#ff6672;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(85,199,255,.14),transparent 28%),radial-gradient(circle at 90% 90%,rgba(255,189,89,.10),transparent 28%),var(--bg)}
.app{max-width:950px;margin:auto;padding:78px 20px 24px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}
.brand{font-weight:900;font-size:18px}
.score{color:var(--muted);font-weight:700}
.progress{height:10px;background:#081522;border-radius:999px;overflow:hidden;margin-bottom:18px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:.35s}
.slide{min-height:620px;background:linear-gradient(145deg,rgba(16,31,52,.98),rgba(11,24,41,.98));border:1px solid var(--border);border-radius:28px;padding:clamp(22px,5vw,46px);display:flex;flex-direction:column;justify-content:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.kicker{color:var(--gold);font-weight:900;margin-bottom:12px}
h1{font-size:clamp(25px,4vw,40px);line-height:1.45;margin:0 0 25px}
.start,.finish{text-align:center}
.start p,.finish p{color:var(--muted);font-size:18px;line-height:1.8}
.options{display:grid;gap:13px}
.option{border:1px solid var(--border);background:#0b192b;color:var(--text);padding:16px 18px;border-radius:15px;text-align:right;font-size:17px;line-height:1.55;cursor:pointer;transition:.2s}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue);background:#10223b}
.option.correct{border-color:var(--green);background:rgba(46,204,113,.17)}
.option.wrong{border-color:var(--red);background:rgba(255,102,114,.17)}
.option:disabled{cursor:default}
.feedback{display:none;margin-top:22px;border-radius:18px;padding:18px 20px;line-height:1.7;background:rgba(255,255,255,.06);border:1px solid var(--border)}
.feedback.good{border-color:rgba(46,204,113,.55)} .feedback.bad{border-color:rgba(255,102,114,.55)}
.feedback-title{font-weight:900;font-size:19px;margin-bottom:6px}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
button.ctrl{border:0;border-radius:13px;padding:13px 19px;font-size:16px;font-weight:900;cursor:pointer}
.primary{background:var(--blue);color:#06111e} .secondary{background:#162a45;color:var(--text);border:1px solid var(--border)!important}
button.ctrl:disabled{opacity:.45;cursor:not-allowed}
.big-score{font-size:76px;font-weight:950;color:var(--gold);margin:12px 0}
.small-note{color:var(--muted);font-size:14px;margin-top:18px}
.menu-home{position:fixed;top:18px;left:18px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:12px 17px;border-radius:13px;background:#162a45;color:var(--text);border:1px solid var(--border);text-decoration:none;font-weight:900;font-size:15px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.menu-home:hover{background:#21416b;transform:translateY(-2px)}
@media(max-width:600px){.app{padding:68px 10px 10px}.slide{min-height:calc(100vh - 115px);border-radius:20px;padding:20px}.option{font-size:16px;padding:14px}.topbar{font-size:14px}.menu-home{top:10px;left:10px;padding:10px 13px;font-size:14px}}
</style>
</head>
<body>
<a class="menu-home" href="index.html">← חזרה לתפריט</a>
<div class="app">
<div class="topbar"><div class="brand">המרשם הקליני</div><div class="score" id="scoreText">מוכן להתחלה</div></div>
<div class="progress"><div id="progressBar"></div></div>
<main class="slide" id="slide"></main>
</div>
<script>
const originalQuestions=[{"q": "מה חובה לציין בפרטי המטופל במרשם חוקי?", "options": ["שם ומספר ת״ז", "שם וכתובת בלבד", "מספר טלפון בלבד", "שם הרופא בלבד"], "answer": 0, "explanation": "בפרטי המטופל יש לציין שם ומספר תעודת זהות; אם המטופל מתחת לגיל 18 יש לציין גם גיל."}, {"q": "מה יש להוסיף בפרטי מטופל מתחת לגיל 18?", "options": ["משקל", "גיל", "כתובת בית ספר", "שם הורה"], "answer": 1, "explanation": "לפי השקופית, במטופל מתחת לגיל 18 חובה לציין גם את הגיל."}, {"q": "איזה פרט שייך לפרטי המרפאה והרופא?", "options": ["שם המרפאה, טלפון ושם הרופא", "רק שם התרופה", "רק תאריך", "רק מספר ת״ז של המטופל"], "answer": 0, "explanation": "במרשם חוקי מופיעים פרטי המרפאה והרופא, כולל שם המרפאה, טלפון ושם הרופא."}, {"q": "מה צריך להופיע בפרטי התרופה?", "options": ["שם התרופה בלבד", "שם מסחרי בלבד", "שם התרופה באותיות לטיניות, צורת הגשה, חוזק, כמות ומינון", "רק מינון"], "answer": 2, "explanation": "השקופית מפרטת: שם התרופה באותיות לטיניות, צורת הגשה, חוזק, כמות ומינון."}, {"q": "מה נדרש לצורך אימות משפטי של המרשם?", "options": ["חתימת המטופל", "חתימת יד של הרופא, חותמת ותאריך", "חותמת בית המרקחת בלבד", "מספר טלפון"], "answer": 1, "explanation": "אימות משפטי כולל חתימת יד של הרופא, חותמת ותאריך."}, {"q": "כיצד מבטלים משבצות פנויות במרשם?", "options": ["משאירים ריקות", "מסמנים V", "מבטלים בקו אלכסוני או ב-X", "כותבים N/A בלבד"], "answer": 2, "explanation": "לפי השקופית, משבצות פנויות יש לבטל בקו אלכסוני או ב-X."}, {"q": "לכמה זמן תקף מרשם רגיל?", "options": ["10 ימים", "15 ימים", "30 ימים", "365 ימים"], "answer": 0, "explanation": "בציר הזמן: מרשם רגיל - 10 ימים."}, {"q": "לכמה זמן תקף מרשם לסם מסוכן?", "options": ["10 ימים", "15 ימים", "30 ימים", "שנה"], "answer": 1, "explanation": "בציר הזמן: סם מסוכן - 15 ימים."}, {"q": "לכמה זמן תקף מרשם לשימוש כרוני ותקופתי?", "options": ["10 ימים", "15 ימים", "30 ימים", "365 ימים"], "answer": 2, "explanation": "בציר הזמן: לשימוש כרוני ותקופתי - 30 ימים."}, {"q": "לכמה זמן יכול להיות תקף מרשם S.O.S מיום כתיבתו?", "options": ["עד 10 ימים", "עד 30 ימים", "עד 6 חודשים", "עד שנה (365 ימים)"], "answer": 3, "explanation": "בשקופית מצוין S.O.S עד שנה, 365 ימים."}, {"q": "באלגוריתם המינון N מייצג:", "options": ["מספר יחידות למנה", "מספר פעמים ביום", "מספר הימים", "דרך מתן"], "answer": 0, "explanation": "N = כמות למנה: מספר יחידות כגון טבליות, מ״ל, מ״ג, טיפות או שאיפות."}, {"q": "באלגוריתם המינון M מייצג:", "options": ["מספר יחידות למנה", "מספר הפעמים ביום לנטילת המנה", "משך הטיפול בשבועות בלבד", "משקל המטופל"], "answer": 1, "explanation": "M = תדירות, כלומר מספר הפעמים ביום לנטילת המנה."}, {"q": "באלגוריתם המינון Day/Week מייצג:", "options": ["חוזק התרופה", "מרווח הזמן/מחזוריות", "גיל", "כמות למנה"], "answer": 1, "explanation": "Day/Week מייצג את מחזוריות הזמן: D = יום, W = שבוע."}, {"q": "במרשם T. Augmentin 500mg 1×3/d, מהו N?", "options": ["1 טבליה", "3", "500", "יום"], "answer": 0, "explanation": "N הוא הכמות למנה, ולכן כאן טבליה אחת."}, {"q": "במרשם T. Augmentin 500mg 1×3/d, מהו M?", "options": ["1", "3 פעמים ביום", "500 mg", "10 ימים"], "answer": 1, "explanation": "M הוא מספר הפעמים ביום, ולכן 3."}, {"q": "מה מסמל d בדוגמה 1×3/d?", "options": ["מנה", "יום", "שבוע", "דרך הפה"], "answer": 1, "explanation": "d מציין יום."}, {"q": "מה פירוש p.o. (per os)?", "options": ["דרך הפה", "לתוך הווריד", "לתוך השריר", "תת-עורי"], "answer": 0, "explanation": "p.o. = דרך הפה."}, {"q": "מה פירוש SL?", "options": ["תת-לשוני", "תת-עורי", "לתוך הווריד", "פתילות"], "answer": 0, "explanation": "SL = תת-לשוני."}, {"q": "מה פירוש T. / Tab.?", "options": ["טבליה", "כמוסה", "סירופ", "משחה"], "answer": 0, "explanation": "T./Tab. = טבליה."}, {"q": "מה פירוש C. / Cap.?", "options": ["קרם", "כמוסה", "טיפות", "אמפולה"], "answer": 1, "explanation": "C./Cap. = כמוסה."}, {"q": "מה פירוש Susp?", "options": ["סירופ", "תרחיף", "משחה", "עירוי"], "answer": 1, "explanation": "Susp = תרחיף."}, {"q": "מה פירוש Syr.?", "options": ["סירופ", "פתילה", "קרם", "טבליה"], "answer": 0, "explanation": "Syr. = סירופ."}, {"q": "מה פירוש IV?", "options": ["לתוך הווריד", "לתוך השריר", "תת-עורי", "דרך הפה"], "answer": 0, "explanation": "IV = לתוך הווריד."}, {"q": "מה פירוש IM?", "options": ["לתוך השריר", "לתוך הווריד", "דרך הרקטום", "תת-לשוני"], "answer": 0, "explanation": "IM = לתוך השריר."}, {"q": "מה פירוש SC?", "options": ["תת-עורי", "תת-לשוני", "דרך הפה", "לתוך הווריד"], "answer": 0, "explanation": "SC = תת-עורי."}, {"q": "מה פירוש Amp?", "options": ["אמפולה", "משחה", "כמוסה", "שאיפה"], "answer": 0, "explanation": "Amp = אמפולה."}, {"q": "מה פירוש Inf.?", "options": ["עירוי", "סירופ", "טבליה", "טיפות"], "answer": 0, "explanation": "Inf. = עירוי."}, {"q": "מה פירוש PR?", "options": ["דרך הרקטום", "דרך הפה", "לתוך השריר", "לעין ימין"], "answer": 0, "explanation": "PR = דרך הרקטום."}, {"q": "מה פירוש Supp?", "options": ["פתילות", "תרחיף", "סירופ", "שאיפות"], "answer": 0, "explanation": "Supp = פתילות."}, {"q": "מה פירוש Vag T?", "options": ["טבליות וגינליות", "טבליות דרך הפה", "טיפות עיניים", "טבליות תת-לשוניות"], "answer": 0, "explanation": "Vag T = טבליות וגינליות."}, {"q": "מה פירוש Ung?", "options": ["משחה", "קרם", "טיפות", "כמוסה"], "answer": 0, "explanation": "Ung = משחה."}, {"q": "מה פירוש Cr.?", "options": ["קרם", "כמוסה", "סירופ", "עירוי"], "answer": 0, "explanation": "Cr. = קרם."}, {"q": "בטיפות עיניים/אוזניים, RE מציין:", "options": ["ימין", "שמאל", "שתי העיניים", "דרך הרקטום"], "answer": 0, "explanation": "RE = עין/אוזן ימין (Right)."}, {"q": "בטיפות עיניים/אוזניים, LE מציין:", "options": ["ימין", "שמאל", "דרך הפה", "לתוך הווריד"], "answer": 1, "explanation": "LE = עין/אוזן שמאל (Left)."}, {"q": "מה פירוש 'LE Coll. Timolol'?", "options": ["טיפות עיניים לעין שמאל", "טיפות עיניים לעין ימין", "טבליה דרך הפה", "זריקה לשריר"], "answer": 0, "explanation": "LE = שמאל ו-Coll. בהקשר הדוגמה הוא טיפות עיניים."}, {"q": "במשאף מדוד MDI/Discus, את הכמות נהוג לרשום כ:", "options": ["puff / שאיפות", "טבליות", "טיפות", "גרמים"], "answer": 0, "explanation": "במשאף הכמות נרשמת כ-puff, כלומר שאיפות."}, {"q": "במכשיר אינהלציה הכמות נרש הוא:", "options": ["אלקטרוקרדיוגרם", "צילום חזה", "דיאליזה", "ניתוח מעקפים"], "answer": 0, "explanation": "ECG/EKG = אלקטרוקרדיוגרם."}, {"q": "CABG הוא:", "options": ["ניתוח מעקפים", "דיאליזה", "צילום חזה", "בדיקת שתן"], "answer": 0, "explanation": "CABG = ניתוח מעקפים."}, {"q": "HD הוא:", "options": ["דיאליזה (Hemodialysis)", "צילום חזה", "בדיקת קרישה", "משאף"], "answer": 0, "explanation": "HD = Hemodialysis, דיאליזה."}, {"q": "מה ההבדל הקריטי בין QD ל-QDS?", "options": ["QD פעם ביום; QDS ארבע פעמים ביום", "QD ארבע פעמים; QDS פעם ביום", "שניהם פעם ביום", "QD לפי הצורך; QDS מיד"], "answer": 0, "explanation": "QD = פעם ביום, בעוד QDS = 4 פעמים ביום."}, {"q": "מה ההבדל בין IV ל-IM?", "options": ["IV לווריד; IM לשריר", "IV לשריר; IM לווריד", "שניהם תת-עוריים", "שניהם דרך הפה"], "answer": 0, "explanation": "IV = לווריד, IM = לשריר."}, {"q": "מה ההבדל בין RE ל-LE בטיפול מקומי?", "options": ["RE ימין; LE שמאל", "RE שמאל; LE ימין", "שניהם ימין", "שניהם שמאל"], "answer": 0, "explanation": "RE = ימין, LE = שמאל."}, {"q": "מה פירוש STAT?", "options": ["מיידי, לביצוע ללא דיחוי", "לפי הצורך", "פעם ביום", "לפני השינה"], "answer": 0, "explanation": "STAT = מיידי, לביצוע ללא דיחוי."}, {"q": "מדוע NKDA הוא 'דגל אדום' שחשוב לוודא?", "options": ["כי יש לוודא שאין אלרגיות ידועות לפני ניפוק", "כי הוא מציין מינון גבוה", "כי הוא מציין טיפול IV", "כי הוא מציין ניתוח"], "answer": 0, "explanation": "בשקופית מודגש ש-NKDA = אין אלרגיות ידועות לתרופות ויש לוודא זאת לפני ניפוק."}, {"q": "לאיזו קטגוריה שייך CBC?", "options": ["בדיקות מעבדה", "מדדים חיוניים", "אנטומיה", "התערבויות"], "answer": 0, "explanation": "CBC מופיע תחת בדיקות מעבדה."}, {"q": "לאיזו קטגוריה שייך ECG?", "options": ["מדדים חיוניים וסטטוס", "מחלות ומצבים", "התערבויות", "תרופות"], "answer": 0, "explanation": "ECG מופיע בקבוצת מדדים חיוניים וסטטוס."}, {"q": "לאיזו קטגוריה שייך CNS?", "options": ["אנטומיה ומערכות גוף", "בדיקות מעבדה", "מחלות", "תדירות מתן"], "answer": 0, "explanation": "CNS הוא קיצור אנטומי של מערכת העצבים המרכזית."}, {"q": "לאיזו קטגוריה שייך PO?", "options": ["התערבויות ופרמקולוגיה / דרך מתן", "מחלה", "בדיקת מעבדה", "מדד חיוני"], "answer": 0, "explanation": "PO הוא דרך מתן תרופה דרך הפה."}, {"q": "לאיזו קטגוריה שייך BID?", "options": ["התערבויות ופרמקולוגיה / תדירות", "אנטומיה", "בדיקת דם", "מחלה"], "answer": 0, "explanation": "BID מציין תדירות מתן: פעמיים ביום."}];
const QUESTIONS_PER_ROUND=30;
let questions=[],index=0,score=0,answered=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}

function startQuiz(){
  questions=JSON.parse(JSON.stringify(originalQuestions));
  shuffle(questions);
  questions=questions.slice(0,Math.min(QUESTIONS_PER_ROUND,questions.length));
  questions.forEach(q=>{const correct=q.options[q.answer];shuffle(q.options);q.answer=q.options.indexOf(correct)});
  index=0;score=0;answered=false;renderQuestion();
}

function renderStart(){
  progressBar.style.width='0%';
  scoreText.textContent='מוכן להתחלה';
  slide.innerHTML=`<section class="start"><div class="kicker">תרגול אינטראקטיבי</div><h1>המרשם הקליני</h1><p>30 שאלות אקראיות בכל סבב, עם משוב והסבר לאחר כל תשובה.</p><button class="ctrl primary" onclick="startQuiz()">התחלת התרגול</button><div class="small-note">${originalQuestions.length} שאלות במאגר • 30 בכל סבב • תשובות בסדר אקראי</div></section>`;
}

function renderQuestion(){
  answered=false;
  const q=questions[index],L=['א','ב','ג','ד'];
  scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;
  progressBar.style.width=`${index/questions.length*100}%`;
  slide.innerHTML=`<div class="kicker">שאלה ${index+1} מתוך ${questions.length}</div><h1>${q.q}</h1><div class="options">${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${L[i]}. ${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="ctrl secondary" onclick="renderStart()">התחלה מחדש</button><button class="ctrl primary" id="nextBtn" onclick="nextQuestion()" disabled>לשאלה הבאה</button></div>`;
}

function answer(choice){
  if(answered)return;
  answered=true;
  const q=questions[index],buttons=[...document.querySelectorAll('.option')];
  buttons.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct')});
  const ok=choice===q.answer;
  if(ok)score++; else buttons[choice].classList.add('wrong');
  const f=document.getElementById('feedback');
  f.style.display='block';f.classList.add(ok?'good':'bad');
  f.innerHTML=`<div class="feedback-title">${ok?'נכון מאוד!':'לא נכון'}</div><div>${q.explanation}</div>`;
  nextBtn.disabled=false;
  scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;
  progressBar.style.width=`${(index+1)/questions.length*100}%`;
}

function nextQuestion(){if(!answered)return;index++;index>=questions.length?renderFinish():renderQuestion()}

function renderFinish(){
  const p=Math.round(score/questions.length*100);
  const msg=p>=90?'מצוין! שליטה חזקה מאוד בחומר.':p>=75?'טוב מאוד! נשארה רק חזרה קצרה.':p>=60?'עבודה טובה, כדאי לחזור על הנושאים שבהם טעית.':'כדאי לעבור שוב על המצגת ולנסות מחדש.';
  scoreText.textContent='התרגול הסתיים';progressBar.style.width='100%';
  slide.innerHTML=`<section class="finish"><div class="kicker">סיום התרגול</div><h1>כל הכבוד!</h1><div class="big-score">${score}/${questions.length}</div><p>${msg}</p><button class="ctrl primary" onclick="startQuiz()">תרגול חדש</button></section>`;
}

document.addEventListener("keydown", function(e) {
  if (e.repeat) return;

  // Backspace = الرجوع للصفحة الرئيسية
  if (e.key === "Backspace") {
    e.preventDefault();
    window.location.href = "index.html";
    return;
  }

  // إذا انتهى الامتحان → Enter يبدأ امتحان جديد
  if (index >= questions.length) {
    if (e.key === "Enter") {
      startQuiz();
    }
    return;
  }

  // أثناء السؤال → 1-4 لاختيار الإجابة
  if (!answered) {
    if (e.key === "1") answer(0);
    else if (e.key === "2") answer(1);
    else if (e.key === "3") answer(2);
    else if (e.key === "4") answer(3);
  }

  // بعد الإجابة → Enter للسؤال التالي
  else if (e.key === "Enter") {
    nextQuestion();
  }
});


renderStart();
</script>
