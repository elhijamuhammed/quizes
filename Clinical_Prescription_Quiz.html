<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>חידון המרשם הקליני</title>
<style>
:root{--bg:#07111f;--card:#101f34;--text:#f7fbff;--muted:#a8bad0;--blue:#55c7ff;--gold:#ffbd59;--green:#2ecc71;--red:#ff6672;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(85,199,255,.14),transparent 28%),radial-gradient(circle at 90% 90%,rgba(255,189,89,.10),transparent 28%),var(--bg)}
.app{max-width:950px;margin:auto;padding:78px 20px 24px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}
.brand{font-weight:900;font-size:18px}
.score{color:var(--muted);font-weight:700}
.progress{height:10px;background:#081522;border-radius:999px;overflow:hidden;margin-bottom:18px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:.35s}
.slide{min-height:620px;background:linear-gradient(145deg,rgba(16,31,52,.98),rgba(11,24,41,.98));border:1px solid var(--border);border-radius:28px;padding:clamp(22px,5vw,46px);display:flex;flex-direction:column;justify-content:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.kicker{color:var(--gold);font-weight:900;margin-bottom:12px}
h1{font-size:clamp(25px,4vw,40px);line-height:1.45;margin:0 0 25px}
.start,.finish{text-align:center}
.start p,.finish p{color:var(--muted);font-size:18px;line-height:1.8}
.options{display:grid;gap:13px}
.option{border:1px solid var(--border);background:#0b192b;color:var(--text);padding:16px 18px;border-radius:15px;text-align:right;font-size:17px;line-height:1.55;cursor:pointer;transition:.2s}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue);background:#10223b}
.option.correct{border-color:var(--green);background:rgba(46,204,113,.17)}
.option.wrong{border-color:var(--red);background:rgba(255,102,114,.17)}
.option:disabled{cursor:default}
.feedback{display:none;margin-top:22px;border-radius:18px;padding:18px 20px;line-height:1.7;background:rgba(255,255,255,.06);border:1px solid var(--border)}
.feedback.good{border-color:rgba(46,204,113,.55)} .feedback.bad{border-color:rgba(255,102,114,.55)}
.feedback-title{font-weight:900;font-size:19px;margin-bottom:6px}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
button.ctrl{border:0;border-radius:13px;padding:13px 19px;font-size:16px;font-weight:900;cursor:pointer}
.primary{background:var(--blue);color:#06111e} .secondary{background:#162a45;color:var(--text);border:1px solid var(--border)!important}
button.ctrl:disabled{opacity:.45;cursor:not-allowed}
.big-score{font-size:76px;font-weight:950;color:var(--gold);margin:12px 0}
.small-note{color:var(--muted);font-size:14px;margin-top:18px}
.menu-home{position:fixed;top:18px;left:18px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:12px 17px;border-radius:13px;background:#162a45;color:var(--text);border:1px solid var(--border);text-decoration:none;font-weight:900;font-size:15px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.menu-home:hover{background:#21416b;transform:translateY(-2px)}
@media(max-width:600px){.app{padding:68px 10px 10px}.slide{min-height:calc(100vh - 115px);border-radius:20px;padding:20px}.option{font-size:16px;padding:14px}.topbar{font-size:14px}.menu-home{top:10px;left:10px;padding:10px 13px;font-size:14px}}
</style>
</head>
<body>
<a class="menu-home" href="index.html">← חזרה לתפריט</a>
<div class="app">
<div class="topbar"><div class="brand">המרשם הקליני</div><div class="score" id="scoreText">מוכן להתחלה</div></div>

<main class="slide" id="slide"></main>

יצג N באלגוריתם המינון?", "options": ["כמות למנה", "תדירות", "יום/שבוע", "שם התרופה"], "answer": 0, "explanation": "N = כמות למנה."}, {"q": "אילו יחידות מובאות כדוגמאות ל־N?", "options": ["טבליות, מ״ל, מ״ג, טיפות, שאיפות", "שעות וימים בלבד", "שנים וחודשים", "לחץ דם ודופק"], "answer": 0, "explanation": "השקופית נותנת כדוגמאות: טבליות, מ״ל, מ״ג, טיפות ושאיפות."}, {"q": "מה מייצג M באלגוריתם המינון?", "options": ["מספר הפעמים ביום לנטילת המנה", "כמות למנה", "שבוע", "דרך מתן"], "answer": 0, "explanation": "M = תדירות, מספר הפעמים ביום."}, {"q": "מה מייצג Day / Week באלגוריתם?", "options": ["מרווח הזמן / המחזוריות", "כמות למנה", "חוזק התרופה", "מספר טבליות"], "answer": 0, "explanation": "Day/Week = מחזוריות."}, {"q": "מה מציין D לפי השקופית?", "options": ["יום", "שבוע", "טבליה", "מנה"], "answer": 0, "explanation": "D = יום."}, {"q": "מה מציין W לפי השקופית?", "options": ["שבוע", "יום", "טבליה", "מ״ל"], "answer": 0, "explanation": "W = שבוע."}, {"q": "בדוגמה T. Augmentin 500mg 1×3/d, מהו N?", "options": ["טבליה אחת", "3", "500mg", "d"], "answer": 0, "explanation": "בשקופית מסומן: N = טבליה אחת."}, {"q": "בדוגמה T. Augmentin 500mg 1×3/d, מהו M?", "options": ["1", "3", "500mg", "d"], "answer": 1, "explanation": "בשקופית מסומן: M = שלוש פעמים."}, {"q": "בדוגמה T. Augmentin 500mg 1×3/d, מה פירוש d?", "options": ["ביום", "בשבוע", "לפי הצורך", "בלילה"], "answer": 0, "explanation": "בשקופית מסומן: ביום."}, {"q": "מה פירוש p.o. (per os) לפי מטריצת צורות המתן?", "options": ["דרך הפה", "תת־לשוני", "טבליה", "כמוסה"], "answer": 0, "explanation": "p.o. (per os) = דרך הפה."}, {"q": "מה פירוש SL לפי מטריצת צורות המתן?", "options": ["תת־לשוני", "דרך הפה", "טבליה", "כמוסה"], "answer": 0, "explanation": "SL = תת־לשוני."}, {"q": "מה פירוש T. / Tab. לפי מטריצת צורות המתן?", "options": ["טבליה", "דרך הפה", "תת־לשוני", "כמוסה"], "answer": 0, "explanation": "T. / Tab. = טבליה."}, {"q": "מה פירוש C. / Cap. לפי מטריצת צורות המתן?", "options": ["כמוסה", "דרך הפה", "תת־לשוני", "טבליה"], "answer": 0, "explanation": "C. / Cap. = כמוסה."}, {"q": "מה פירוש Susp לפי מטריצת צורות המתן?", "options": ["תרחיף", "דרך הפה", "תת־לשוני", "טבליה"], "answer": 0, "explanation": "Susp = תרחיף."}, {"q": "מה פירוש Syr. לפי מטריצת צורות המתן?", "options": ["סירופ", "דרך הפה", "תת־לשוני", "טבליה"], "answer": 0, "explanation": "Syr. = סירופ."}, {"q": "מה פירוש IV לפי מטריצת צורות המתן?", "options": ["לתוך הווריד", "דרך הפה", "תת־לשוני", "טבליה"], "answer": 0, "explanation": "IV = לתוך הווריד."}, {"q": "מה פירוש IM לפי מטריצת צורות המתן?", "options": ["לתוך השריר", "דרך הפה", "תת־לשוני", "טבליה"], "answer": 0, "explanation": "IM = לתוך השריר."}, {"q": "מה פירוש SC לפי מטריצת צורות המתן?", "options": ["תת־עורי", "דרך הפה", "תת־לשוני", "טבליה"], "answer": 0, "explanation": "SC = תת־עורי."}, {"q": "מה פירוש Amp לפי מטריצת צורות המתן?", "options": ["אמפולה", "דרך הפה", "תת־לשוני", "טבליה"], "answer": 0, "explanation": "Amp = אמפולה."}, {"q": "מה פירוש Inf. לפי מטריצת צורות המתן?", "options": ["עירוי", "דרך הפה", "תת־לשוני", "טבליה"], "answer": 0, "explanation": "Inf. = עירוי."}, {"q": "מה פירוש PR לפי מטריצת צורות המתן?", "options": ["דרך הרקטום", "דרך הפה", "תת־לשוני", "טבליה"], "answer": 0, "explanation": "PR = דרך הרקטום."}, {"q": "מה פירוש Supp לפי מטריצת צורות המתן?", "options": ["פתילות", "דרך הפה", "תת־לשוני", "טבליה"], "answer": 0, "explanation": "Supp = פתילות."}, {"q": "מה פירוש Vag T לפי מטריצת צורות המתן?", "options": ["טבליות וגינליות", "דרך הפה", "תת־לשוני", "טבליה"], "answer": 0, "explanation": "Vag T = טבליות וגינליות."}, {"q": "מה פירוש Ung לפי מטריצת צורות המתן?", "options": ["משחה", "דרך הפה", "תת־לשוני", "טבליה"], "answer": 0, "explanation": "Ung = משחה."}, {"q": "מה פירוש Cr. לפי מטריצת צורות המתן?", "options": ["קרם", "דרך הפה", "תת־לשוני", "טבליה"], "answer": 0, "explanation": "Cr. = קרם."}, {"q": "מה מציין RE בקיצורים לעיניים ואוזניים?", "options": ["ימין (Right)", "שמאל (Left)", "שתי העיניים", "דרך הפה"], "answer": 0, "explanation": "RE = עין/אוזן ימין."}, {"q" ", "נוזל חוט שדרה"], "answer": 0, "explanation": "LA / RA = עליות הלב (שמאל/ימין)."}, {"q": "מה פירוש GI לפי שקופית האנטומיה?", "options": ["מערכת העיכול", "מערכת עצבים מרכזית", "ראש, אוזניים, עיניים, אף וגרון", "נוזל חוט שדרה"], "answer": 0, "explanation": "GI = מערכת העיכול."}, {"q": "מה פירוש GU לפי שקופית האנטומיה?", "options": ["מערכת השתן והמין", "מערכת עצבים מרכזית", "ראש, אוזניים, עיניים, אף וגרון", "נוזל חוט שדרה"], "answer": 0, "explanation": "GU = מערכת השתן והמין."}, {"q": "מה פירוש LE לפי שקופית האנטומיה?", "options": ["גפיים תחתונות", "מערכת עצבים מרכזית", "ראש, אוזניים, עיניים, אף וגרון", "נוזל חוט שדרה"], "answer": 0, "explanation": "LE = גפיים תחתונות."}, {"q": "מה פירוש PNS לפי שקופית האנטומיה?", "options": ["מערכת עצבים היקפית", "מערכת עצבים מרכזית", "ראש, אוזניים, עיניים, אף וגרון", "נוזל חוט שדרה"], "answer": 0, "explanation": "PNS = מערכת עצבים היקפית."}, {"q": "מה פירוש SSRI?", "options": ["נוגדי דיכאון המעכבים ספיגה חוזרת של סרוטונין", "נוגדי דלקת שאינם סטרואידים", "מעכבי משאבות פרוטונים", "תרופות ללחץ דם"], "answer": 0, "explanation": "SSRI = נוגדי דיכאון המעכבים ספיגה חוזרת של סרוטונין."}, {"q": "מה פירוש PPI?", "options": ["מעכבי משאבות פרוטונים", "נוגדי דלקת", "נוגדי דיכאון", "תרופות לדיאליזה"], "answer": 0, "explanation": "PPI = מעכבי משאבות פרוטונים."}, {"q": "מה פירוש CXR לפי שקופית הדמיה והליכים?", "options": ["צילום חזה (Chest X-Ray)", "הדמיות", "אלקטרוקרדיוגרם", "ניתוח מעקפים"], "answer": 0, "explanation": "CXR = צילום חזה (Chest X-Ray)."}, {"q": "מה פירוש MRI / CT / US לפי שקופית הדמיה והליכים?", "options": ["הדמיות", "צילום חזה (Chest X-Ray)", "אלקטרוקרדיוגרם", "ניתוח מעקפים"], "answer": 0, "explanation": "MRI / CT / US = הדמיות."}, {"q": "מה פירוש ECG / EKG לפי שקופית הדמיה והליכים?", "options": ["אלקטרוקרדיוגרם", "צילום חזה (Chest X-Ray)", "הדמיות", "ניתוח מעקפים"], "answer": 0, "explanation": "ECG / EKG = אלקטרוקרדיוגרם."}, {"q": "מה פירוש CABG לפי שקופית הדמיה והליכים?", "options": ["ניתוח מעקפים", "צילום חזה (Chest X-Ray)", "הדמיות", "אלקטרוקרדיוגרם"], "answer": 0, "explanation": "CABG = ניתוח מעקפים."}, {"q": "מה ההבדל שמודגש בין QD ל־QDS?", "options": ["QD פעם ביום; QDS 4 פעמים ביום", "QD 4 פעמים ביום; QDS פעם ביום", "שניהם פעם ביום", "שניהם 4 פעמים ביום"], "answer": 0, "explanation": "זה ההבדל שמופיע תחת Critical Distinctions."}, {"q": "מה ההבדל שמודגש בין IV ל־IM?", "options": ["IV לווריד; IM לשריר", "IV לשריר; IM לווריד", "שניהם לווריד", "שניהם לשריר"], "answer": 0, "explanation": "זה ההבדל שמופיע תחת Critical Distinctions."}, {"q": "מה ההבדל שמודגש בין RE ל־LE?", "options": ["RE ימין; LE שמאל", "RE שמאל; LE ימין", "שניהם ימין", "שניהם שמאל"], "answer": 0, "explanation": "זה ההבדל שמופיע תחת Critical Distinctions."}, {"q": "מה פירוש STAT לפי הדגלים האדומים?", "options": ["מיידי (Immediately), לביצוע ללא דיחוי", "לפי הצורך", "פעם ביום", "לפני השינה"], "answer": 0, "explanation": "STAT = מיידי, לביצוע ללא דיחוי."}, {"q": "מה פירוש NKDA לפי הדגלים האדומים?", "options": ["אין אלרגיות ידועות; חובה לוודא לפני ניפוק", "לפי הצורך", "מיידי", "4 פעמים ביום"], "answer": 0, "explanation": "NKDA = אין אלרגיות ידועות; חובה לוודא לפני ניפוק."}];
const QUESTIONS_PER_ROUND=30;
let questions=[],index=0,score=0,answered=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}

function startQuiz(){
  questions=JSON.parse(JSON.stringify(originalQuestions));
  shuffle(questions);
  questions=questions.slice(0,Math.min(QUESTIONS_PER_ROUND,questions.length));
  questions.forEach(q=>{const correct=q.options[q.answer];shuffle(q.options);q.answer=q.options.indexOf(correct)});
  index=0;score=0;answered=false;renderQuestion();
}

function renderStart(){
  progressBar.style.width='0%';
  scoreText.textContent='מוכן להתחלה';
  slide.innerHTML=`<section class="start"><div class="kicker">תרגול אינטראקטיבי</div><h1>המרשם הקליני</h1><p>30 שאלות אקראיות בכל סבב, עם משוב והסבר לאחר כל תשובה.</p><button class="ctrl primary" onclick="startQuiz()">התחלת התרגול</button><div class="small-note">${originalQuestions.length} שאלות במאגר • 30 בכל סבב • רק מידע שמופיע במצגת • תשובות בסדר אקראי</div></section>`;
}

function renderQuestion(){
  answered=false;
  const q=questions[index],L=['א','ב','ג','ד'];
  scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;
  progressBar.style.width=`${index/questions.length*100}%`;
  slide.innerHTML=`<div class="kicker">שאלה ${index+1} מתוך ${questions.length}</div><h1>${q.q}</h1><div class="options">${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${L[i]}. ${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="ctrl secondary" onclick="renderStart()">התחלה מחדש</button><button class="ctrl primary" id="nextBtn" onclick="nextQuestion()" disabled>לשאלה הבאה</button></div>`;
}

function answer(choice){
  if(answered)return;
  answered=true;
  const q=questions[index],buttons=[...document.querySelectorAll('.option')];
  buttons.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct')});
  const ok=choice===q.answer;
  if(ok)score++; else buttons[choice].classList.add('wrong');
  const f=document.getElementById('feedback');
  f.style.display='block';f.classList.add(ok?'good':'bad');
  f.innerHTML=`<div class="feedback-title">${ok?'נכון מאוד!':'לא נכון'}</div><div>${q.explanation}</div>`;
  nextBtn.disabled=false;
  scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;
  progressBar.style.width=`${(index+1)/questions.length*100}%`;
}

function nextQuestion(){if(!answered)return;index++;index>=questions.length?renderFinish():renderQuestion()}

function renderFinish(){
  const p=Math.round(score/questions.length*100);
  const msg=p>=90?'מצוין! שליטה חזקה מאוד בחומר.':p>=75?'טוב מאוד! נשארה רק חזרה קצרה.':p>=60?'עבודה טובה, כדאי לחזור על הנושאים שבהם טעית.':'כדאי לעבור שוב על המצגת ולנסות מחדש.';
  scoreText.textContent='התרגול הסתיים';progressBar.style.width='100%';
  slide.innerHTML=`<section class="finish"><div class="kicker">סיום התרגול</div><h1>כל הכבוד!</h1><div class="big-score">${score}/${questions.length}</div><p>${msg}</p><button class="ctrl primary" onclick="startQuiz()">תרגול חדש</button></section>`;
}

document.addEventListener("keydown", function(e) {
  if (e.repeat) return;

  // Backspace = الرجوع للصفحة الرئيسية
  if (e.key === "Backspace") {
    e.preventDefault();
    window.location.href = "index.html";
    return;
  }

  // إذا انتهى الامتحان → Enter يبدأ امتحان جديد
  if (index >= questions.length) {
    if (e.key === "Enter") {
      startQuiz();
    }
    return;
  }

  // أثناء السؤال → 1-4 لاختيار الإجابة
  if (!answered) {
    if (e.key === "1") answer(0);
    else if (e.key === "2") answer(1);
    else if (e.key === "3") answer(2);
    else if (e.key === "4") answer(3);
  }

  // بعد الإجابة → Enter للسؤال التالي
  else if (e.key === "Enter") {
    nextQuestion();
  }
});


renderStart();
</script>
