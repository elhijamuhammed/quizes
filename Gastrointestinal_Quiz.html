<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>חידון מערכת העיכול</title>
<style>
:root{--bg:#06111f;--card:#102238;--text:#f7fbff;--muted:#a9bad0;--blue:#58c9ff;--gold:#ffc15d;--green:#2ecc71;--red:#ff6672;--line:rgba(255,255,255,.13)}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 12% 8%,rgba(88,201,255,.14),transparent 28%),radial-gradient(circle at 88% 92%,rgba(255,193,93,.11),transparent 30%),var(--bg)}
.app{width:min(980px,100%);margin:auto;padding:20px} .menu-home{position:fixed;top:16px;left:16px;z-index:20;text-decoration:none;color:var(--text);background:#142741;border:1px solid var(--line);padding:11px 15px;border-radius:12px;font-weight:900}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:18px 0 14px} .brand{font-weight:900} .score{color:var(--muted);font-weight:800}
.progress{height:10px;background:#091725;border-radius:999px;overflow:hidden;margin-bottom:18px} .progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:.3s}
.slide{min-height:640px;background:linear-gradient(145deg,#102238,#0b1a2d);border:1px solid var(--line);border-radius:28px;padding:clamp(24px,5vw,48px);display:flex;flex-direction:column;justify-content:center;box-shadow:0 25px 70px rgba(0,0,0,.28)}
.kicker{color:var(--gold);font-weight:900;margin-bottom:12px} h1{font-size:clamp(27px,4vw,42px);line-height:1.4;margin:0 0 26px} .lead{color:var(--muted);font-size:18px;line-height:1.8}
.options{display:grid;gap:13px} .option{border:1px solid var(--line);background:#0b192b;color:var(--text);padding:17px 18px;border-radius:15px;text-align:right;font-size:17px;cursor:pointer;transition:.18s}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(88,201,255,.45)} .option.correct{border-color:var(--green);background:rgba(46,204,113,.17)} .option.wrong{border-color:var(--red);background:rgba(255,102,114,.17)}
.feedback{display:none;margin-top:22px;border-radius:18px;padding:18px 20px;line-height:1.75;background:rgba(255,255,255,.06);border:1px solid var(--line)} .actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
button.ctrl{border:0;border-radius:13px;padding:13px 19px;font-size:16px;font-weight:900;cursor:pointer} .primary{background:var(--blue);color:#06111e} .secondary{background:#162a45;color:var(--text)} .start,.finish{text-align:center}
.big-score{font-size:clamp(58px,10vw,88px);font-weight:950;color:var(--gold);margin:12px 0} .review-title{margin-top:34px;text-align:right;color:var(--blue)} .review-list{display:grid;gap:12px;text-align:right} .review-item{background:rgba(255,255,255,.05);border:1px solid var(--line);padding:15px;border-radius:14px}
@media(max-width:650px){.app{padding:10px}.menu-home{position:static;display:inline-block;margin:10px 0 0 10px}.slide{min-height:calc(100vh - 105px);border-radius:20px;padding:20px}.topbar{margin-top:10px}}
</style></head>
<body>
<a class="menu-home" href="index.html">↩ חזרה לתפריט</a>
<div class="app"><div class="topbar"><div class="brand">מערכת העיכול</div><div class="score" id="scoreText">מוכן להתחלה</div></div><div class="progress"><div id="progressBar"></div></div><main class="slide" id="slide"></main></div>
<script>
const questionBank=[{"q": "איזה מהבאים נכלל בהגדרה הקלינית של עצירות?", "options": ["יותר משלוש יציאות ביום", "פחות משלוש יציאות בשבוע", "שלשול מימי במשך 24 שעות", "כאבי בטן בלבד"], "answer": 1, "explanation": "עצירות יכולה להתבטא בפחות משלוש יציאות בשבוע."}, {"q": "איזה סימפטום מתאים לעצירות?", "options": ["צואה רכה מאוד", "תחושת התרוקנות לא מלאה", "הקאות דמיות", "חום גבוה"], "answer": 1, "explanation": "תחושת התרוקנות לא מלאה היא אחד הקריטריונים הקליניים לעצירות."}, {"q": "מתי עצירות נחשבת כרונית?", "options": ["מעל שבוע", "מעל חודש", "מעל 3 חודשים", "רק אם נדרש חוקן"], "answer": 2, "explanation": "במצגת עצירות כרונית מוגדרת כאשר התסמינים נמשכים מעל שלושה חודשים."}, {"q": "איזה מהבאים הוא דגל אדום בעצירות?", "options": ["פעילות גופנית מועטה", "דם בצואה", "שתייה מועטה", "תזונה דלה בסיבים"], "answer": 1, "explanation": "דם בצואה או בדיקת דם סמוי חיובית דורשים בירור רפואי."}, {"q": "מהו השלב הראשון בטיפול בעצירות?", "options": ["משלשלים ממריצים", "Prucalopride", "התערבות לא־תרופתית", "אנטיביוטיקה"], "answer": 2, "explanation": "הטיפול מתחיל בסיבים, נוזלים ופעילות גופנית."}, {"q": "מהי צריכת הסיבים המומלצת?", "options": ["5–10 גרם", "10–15 גרם", "20–35 גרם", "מעל 60 גרם"], "answer": 2, "explanation": "היעד במצגת הוא 20–35 גרם סיבים ביום ובהדרגה."}, {"q": "איזו הנחיה חשובה עם משלשלים מרחיבי נפח?", "options": ["להימנע משתייה", "לשתות הרבה מים", "ליטול עם אנטיביוטיקה", "רק לפני שינה"], "answer": 1, "explanation": "משלשלים מרחיבי נפח סופחים מים ולכן יש לשתות מספיק."}, {"q": "איזה חומר הוא משלשל אוסמוטי?", "options": ["PEG", "Loperamide", "Famotidine", "Ondansetron"], "answer": 0, "explanation": "PEG מושך מים לחלל המעי ופועל כמשלשל אוסמוטי."}, {"q": "מהו מנגנון הפעולה של Lactulose?", "options": ["חסימת D2", "סוכר לא נספג המושך מים", "חסימת H2", "אגוניסט מיו"], "answer": 1, "explanation": "Lactulose הוא סוכר סינתטי לא נספג היוצר אפקט אוסמוטי."}, {"q": "איזו קבוצה נחשבת קו שני בעצירות?", "options": ["משלשלים ממריצים", "חוסמי H2", "אנטיביוטיקה", "אנטיהיסטמינים"], "answer": 0, "explanation": "משלשלים ממריצים מוגדרים כקו שני."}, {"q": "כמה זמן אין להשתמש במשלשלים ממריצים ברצף ללא בירור?", "options": ["יום אחד", "3 ימים", "מעל 5–7 ימים", "חודש"], "answer": 2, "explanation": "שימוש מעל 5–7 ימים ברצף דורש בירור סיבת העצירות."}, {"q": "מתי קיימת התוויית נגד מוחלטת למשלשלים ממריצים?", "options": ["חסימת מעי", "מיגרנה", "אסתמה", "יתר לחץ דם"], "answer": 0, "explanation": "חסימת מעי היא התוויית נגד מוחלטת."}, {"q": "מהו מנגנון הפעולה של Prucalopride?", "options": ["אגוניסט 5-HT4", "אנטגוניסט H1", "מעכב PPI", "אגוניסט מיו"], "answer": 0, "explanation": "Prucalopride מגביר מוטיליות דרך אגוניזם סלקטיבי ל־5-HT4."}, {"q": "מהו הטיפול הראשוני המועדף בעצירות בהריון?", "options": ["Senna", "הגברת סיבים ונוזלים", "Prucalopride", "Bisacodyl ממושך"], "answer": 1, "explanation": "בהריון מתחילים באמצעים בטוחים ולא־תרופתיים."}, {"q": "מהי ההגדרה לשלשול חריף?", "options": ["מעל 3 יציאות מימיות ב־24 שעות", "פחות משתי יציאות ביום", "כאבי בטן בלבד", "שלשול מעל חודש"], "answer": 0, "explanation": "שלשול חריף מוגדר כמעל שלוש יציאות מימיות ב־24 שעות."}, {"q": "מהו הבסיס לטיפול בשלשול חריף?", "options": ["Loperamide לכל מטופל", "אנטיביוטיקה לכל מטופל", "החזרת נוזלים ב־ORS", "צום מוחלט"], "answer": 2, "explanation": "אבן היסוד היא החזרת נוזלים, בדרך כלל עם ORS."}, {"q": "מדוע ORS יעיל?", "options": ["חוסם ואגוס", "מנצל ספיגה משותפת של נתרן וגלוקוז", "מעכב חומצה", "הורג חיידקים"], "answer": 1, "explanation": "ORS מנצל קו-טרנספורט של נתרן וגלוקוז ומאפשר ספיגת מים."}, {"q": "מהו מנגנון הפעולה של Loperamide?", "options": ["אגוניסט מיו בדופן המעי", "חוסם H2", "אנטגוניסט D2", "חוסם 5HT3"], "answer": 0, "explanation": "Loperamide מאט תנועתיות באמצעות קולטני מיו בדופן המעי."}, {"q": "באיזה מצב אסור להשתמש ב-Loperamide?", "options": ["שלשול מימי ללא חום", "דם בצואה או חשד לזיהום חודרני", "בחילת נסיעה", "רפלוקס"], "answer": 1, "explanation": "אין להשתמש בו בדיזנטריה, חום גבוה או חשד לזיהום חודרני."}, {"q": "מהם מנגנוני הפעולה של Bismuth subsalicylate?", "options": ["הגנה רירית, אנטי־דלקתי ואנטי־מיקרוביאלי", "חסימת D2,H1,M1", "עיכוב חומצה בלבד", "הגברת תנועה בלבד"], "answer": 0, "explanation": "לביסמות פעילות מגינה על הרירית, אנטי־דלקתית ואנטי־מיקרוביאלית."}, {"q": "באיזו אוכלוסייה קיים חשש לתסמונת Reye?", "options": ["קשישים", "ילדים ומתבגרים עם מחלה ויראלית", "נשים בהריון בלבד", "חולי לחץ דם"], "answer": 1, "explanation": "בגלל המרכיב הסליצילטי יש להיזהר בילדים עם מחלה ויראלית."}, {"q": "איזה מרכז קולט תרופות ורעלים מהדם?", "options": ["CTZ", "קורטקס בלבד", "ואגוס בלבד", "וסטיבולרי בלבד"], "answer": 0, "explanation": "ה-CTZ חשוף לחומרים בדם ומעביר אותות למרכז ההקאה."}, {"q": "מהו היעד העיקרי של Metoclopramide?", "options": ["D2", "H2", "NK1", "H1"], "answer": 0, "explanation": "Metoclopramide הוא אנטגוניסט D2 עם פעילות פרוקינטית."}, {"q": "איזו תופעת לוואי אופיינית ל-Metoclopramide?", "options": ["EPS", "היפוגליקמיה", "שיעול", "כיב"], "answer": 0, "explanation": "חסימת דופמין מרכזית עלולה לגרום ל-EPS."}, {"q": "מהו יתרון Domperidone לעומת Metoclopramide?", "options": ["חוצה BBB יותר", "פחות חודר למוח ולכן פחות EPS", "ללא השפעה לבבית", "חוסם 5HT3"], "answer": 1, "explanation": "Domperidone כמעט אינו חוצה BBB ולכן גורם פחות לתופעות אקסטרה־פירמידליות."}, {"q": "מהי אזהרה מרכזית ב-Domperidone?", "options": ["הארכת QT", "תסמונת Reye", "דימום מוחי", "היפוגליקמיה"], "answer": 0, "explanation": "Domperidone עלול להאריך QT ולהעלות סיכון להפרעות קצב."}, {"q": "לאיזו קבוצה שייך Ondansetron?", "options": ["חוסמי 5HT3", "חוסמי H1", "חוסמי D2", "חוסמי H2"], "answer": 0, "explanation": "Ondansetron הוא אנטגוניסט ל־5HT3."}, {"q": "איזו קבוצה מתאימה במיוחד למחלת נסיעה?", "options": ["חוסמי H1", "חוסמי H2", "PPI", "אנטיביוטיקה"], "answer": 0, "explanation": "אנטיהיסטמינים H1 מתאימים למחלת נסיעה, אך עלולים לגרום לסדציה."}, {"q": "מהו ההרכב של Diclectin?", "options": ["Doxylamine + Vitamin B6", "Ondansetron + B12", "Metoclopramide + B6", "Famotidine + B6"], "answer": 0, "explanation": "Diclectin משלב Doxylamine וויטמין B6 לבחילות בהריון."}, {"q": "איזה קולטן חוסם Aprepitant?", "options": ["NK1", "D2", "H1", "H2"], "answer": 0, "explanation": "Aprepitant הוא אנטגוניסט NK1."}, {"q": "איזו תופעת לוואי ייחודית יחסית ל-Aprepitant?", "options": ["שיהוקים", "דימום רקטלי", "היפרפרולקטינמיה", "היפוגליקמיה"], "answer": 0, "explanation": "במצגת מצוינים שיהוקים כתופעת לוואי אופיינית."}, {"q": "איזה גורם מרכזי קשור לכיב פפטי?", "options": ["H. pylori", "חוסר ויטמין C בלבד", "פעילות גופנית", "שתייה מרובה"], "answer": 0, "explanation": "H. pylori הוא גורם מרכזי לכיב פפטי לצד NSAIDs."}, {"q": "כיצד NSAIDs מעלים סיכון לכיב?", "options": ["מגבירים ריר", "פוגעים בהגנת הרירית", "חוסמים חומצה", "מגבירים ספיגת גלוקוז"], "answer": 1, "explanation": "NSAIDs מפחיתים מנגנוני הגנה של רירית הקיבה."}, {"q": "מהו מנגנון הפעולה של Famotidine?", "options": ["חסימת H2 בתאים פריאטליים", "חסימת D2", "אגוניסט 5HT4", "מחסום מכני"], "answer": 0, "explanation": "Famotidine מפחית חומצה באמצעות חסימת קולטני H2."}, {"q": "מה עושה Gaviscon?", "options": ["יוצר שכבת רפסודה מכנית מעל תוכן הקיבה", "חוסם D2", "מחסל H. pylori", "מעכב SGLT2"], "answer": 0, "explanation": "אלגינט יוצר שכבה צפה ומפחית עליית חומצה לוושט."}, {"q": "מה ההבדל האנטומי העיקרי בין Crohn ל-UC?", "options": ["Crohn מוגבלת לרקטום", "UC בכל מערכת העיכול", "Crohn בכל מערכת העיכול ו-UC במעי הגס", "אין הבדל"], "answer": 2, "explanation": "Crohn יכולה לערב כל חלק, UC מוגבלת לרקטום ולמעי הגס."}, {"q": "איזה דפוס פיזור אופייני ל-Crohn?", "options": ["רציף", "Skip lesions", "רק קיבה", "רק תריסריון"], "answer": 1, "explanation": "Crohn מאופיינת בפיזור מקוטע."}, {"q": "איזו מחלה מאופיינת בדלקת רציפה ושטחית?", "options": ["Crohn", "Ulcerative colitis", "IBS", "GERD"], "answer": 1, "explanation": "UC מאופיינת בדלקת רציפה של הרירית."}, {"q": "איזה סיבוך קשור במיוחד ל-UC?", "options": ["Toxic megacolon", "פיסטולות", "ספיגה מוגברת", "עצירות בלבד"], "answer": 0, "explanation": "Toxic megacolon הוא סיבוך חמור של UC."}, {"q": "איזה סיבוך אופייני יותר ל-Crohn?", "options": ["פיסטולות ומורסות", "רק הקאות", "היפרקלמיה", "Tolerance"], "answer": 0, "explanation": "Crohn עלולה לגרום לפיסטולות, מורסות והיצרויות."}, {"q": "מהי מטרת-העל בטיפול ב-IBD?", "options": ["להפסיק כל תרופה", "לשפר איכות חיים", "להעלות יציאות", "להימנע מפעילות"], "answer": 1, "explanation": "מטרת-העל היא שיפור איכות החיים לצד הפוגה והפחתת סיבוכים."}]; const ROUND_SIZE=20;
let questions=[],index=0,score=0,answered=false,mistakes=[];
const slide=document.getElementById('slide'),progressBar=document.getElementById('progressBar'),scoreText=document.getElementById('scoreText');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildRound(){const pool=JSON.parse(JSON.stringify(questionBank));shuffle(pool);questions=pool.slice(0,Math.min(ROUND_SIZE,pool.length));questions.forEach(q=>{const c=q.options[q.answer];shuffle(q.options);q.answer=q.options.indexOf(c)})}
function renderStart(){progressBar.style.width='0%';scoreText.textContent='מוכן להתחלה';slide.innerHTML=`<section class="start"><div class="kicker">תרגול אינטראקטיבי</div><h1>מערכת העיכול</h1><p class="lead">20 שאלות אקראיות בכל סבב מתוך בנק של ${questionBank.length} שאלות.<br>עצירות, שלשול, בחילות והקאות, כיב פפטי ו-IBD.</p><button class="ctrl primary" onclick="startQuiz()">התחלת התרגול</button></section>`}
function startQuiz(){buildRound();index=0;score=0;mistakes=[];renderQuestion()}
function renderQuestion(){answered=false;const q=questions[index],L=['א','ב','ג','ד'];scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;progressBar.style.width=`${index/questions.length*100}%`;slide.innerHTML=`<div class="kicker">שאלה ${index+1} מתוך ${questions.length}</div><h1>${q.q}</h1><div class="options">${q.options.map((o,i)=>`<button class="option" onclick="answerQuestion(${i})">${L[i]}. ${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="ctrl secondary" onclick="renderStart()">התחלה מחדש</button><button class="ctrl primary" id="nextBtn" onclick="nextQuestion()" disabled>${index===questions.length-1?'סיום':'לשאלה הבאה'}</button></div>`}
function answerQuestion(choice){if(answered)return;answered=true;const q=questions[index],bs=[...document.querySelectorAll('.option')];bs.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct')});const ok=choice===q.answer;if(ok)score++;else{bs[choice].classList.add('wrong');mistakes.push({q:q.q,correct:q.options[q.answer],explanation:q.explanation})};feedback.style.display='block';feedback.innerHTML=`<strong>${ok?'נכון מאוד!':'לא נכון'}</strong><br>${q.explanation}`;nextBtn.disabled=false;scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;progressBar.style.width=`${(index+1)/questions.length*100}%`}
function nextQuestion(){index++;index>=questions.length?renderFinish():renderQuestion()}
function renderFinish(){scoreText.textContent='התרגול הסתיים';progressBar.style.width='100%';const msg=score>=18?'מצוין!':score>=15?'טוב מאוד!':score>=12?'יפה, כדאי לחזור על הטעויות.':'כדאי לעבור שוב על ההסברים.';const review=mistakes.length?`<h2 class="review-title">חזרה על טעויות</h2><div class="review-list">${mistakes.map(m=>`<div class="review-item"><strong>${m.q}</strong><br>התשובה הנכונה: ${m.correct}<br><span style="color:var(--muted)">${m.explanation}</span></div>`).join('')}</div>`:'<p class="lead">לא היו טעויות בסבב הזה.</p>';slide.innerHTML=`<section class="finish"><div class="kicker">סיום התרגול</div><h1>כל הכבוד!</h1><div class="big-score">${score}/${questions.length}</div><p class="lead">${msg}</p><button class="ctrl primary" onclick="startQuiz()">תרגול חדש</button>${review}</section>`}

// ===== Keyboard shortcuts =====
// 1-4: choose answer
// Enter: next question
// Enter on finish screen: new quiz
// Backspace: return to index.html
document.addEventListener("keydown", function (e) {
  if (e.repeat) return;

  // Backspace -> main menu
  if (e.key === "Backspace") {
    e.preventDefault();
    window.location.href = "index.html";
    return;
  }

  // Finish screen -> Enter starts a new quiz
  if (document.querySelector(".finish")) {
    if (e.key === "Enter") {
      e.preventDefault();
      startQuiz();
    }
    return;
  }

  // While a question is shown -> 1,2,3,4 select answers
  const optionButtons = document.querySelectorAll(".option");
  if (!answered && optionButtons.length > 0) {
    const keyMap = {
      "1": 0,
      "2": 1,
      "3": 2,
      "4": 3
    };

    if (Object.prototype.hasOwnProperty.call(keyMap, e.key)) {
      e.preventDefault();
      const choice = keyMap[e.key];

      if (optionButtons[choice] && !optionButtons[choice].disabled) {
        answerQuestion(choice);
      }
      return;
    }
  }

  // After answering -> Enter goes to next question
  if (answered && e.key === "Enter") {
    e.preventDefault();
    nextQuestion();
  }
});

renderStart();
</script>
