<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אמצעי מניעה</title><style>
:root{--bg:#07111f;--card:#101f34;--text:#f7fbff;--muted:#a8bad0;--blue:#55c7ff;--gold:#ffbd59;--green:#2ecc71;--red:#ff6672;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:var(--bg)}.app{max-width:950px;margin:auto;padding:78px 20px 24px}.topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.brand{font-weight:900}.score{color:var(--muted);font-weight:700}.progress{height:10px;background:#081522;border-radius:999px;overflow:hidden;margin-bottom:18px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:.35s}.slide{min-height:620px;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:clamp(22px,5vw,46px);display:flex;flex-direction:column;justify-content:center}.kicker{color:var(--gold);font-weight:900;margin-bottom:12px}h1{font-size:clamp(25px,4vw,40px);line-height:1.45;margin:0 0 25px}.start,.finish{text-align:center}.start p,.finish p{color:var(--muted);font-size:18px;line-height:1.8}.options{display:grid;gap:13px}.option{border:1px solid var(--border);background:#0b192b;color:var(--text);padding:16px 18px;border-radius:15px;text-align:right;font-size:17px;cursor:pointer}.option.correct{border-color:var(--green);background:rgba(46,204,113,.17)}.option.wrong{border-color:var(--red);background:rgba(255,102,114,.17)}.feedback{display:none;margin-top:22px;border-radius:18px;padding:18px 20px;line-height:1.7;background:rgba(255,255,255,.06);border:1px solid var(--border)}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}button.ctrl{border:0;border-radius:13px;padding:13px 19px;font-size:16px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#06111e}.secondary{background:#162a45;color:var(--text)}button:disabled{opacity:.45}.big-score{font-size:76px;font-weight:950;color:var(--gold)}.menu-home{position:fixed;top:18px;left:18px;padding:12px 17px;border-radius:13px;background:#162a45;color:#fff;text-decoration:none;font-weight:900}@media(max-width:600px){.app{padding:68px 10px 10px}.slide{min-height:calc(100vh - 115px);border-radius:20px;padding:20px}}
</style></head><body><a class="menu-home" href="index.html">← חזרה לתפריט</a><div class="app"><div class="topbar"><div class="brand">אמצעי מניעה</div><div class="score" id="scoreText">מוכן להתחלה</div></div><div class="progress"><div id="progressBar"></div></div><main class="slide" id="slide"></main></div><script>
const originalQuestions=[{"q": "מהו מנגנון עיקרי של גלולות הורמונליות משולבות?", "options": ["דיכוי ציר היפותלמוס-היפופיזה-שחלה ומניעת ביוץ", "העלאת LH", "הגברת GnRH", "הפעלת FSH"], "answer": 0, "explanation": "הגלולות יוצרות משוב שלילי ומדכאות FSH/LH."}, {"q": "מה עושה האסטרוגן בגלולה המשולבת?", "options": ["מדכא FSH ומייצב את רירית הרחם", "מעלה FSH", "מגביר ביוץ", "מפרק פרוגסטרון"], "answer": 0, "explanation": "האסטרוגן מסייע לדיכוי FSH ולייצוב הרירית."}, {"q": "מה עושה הפרוגסטין בגלולה המשולבת?", "options": ["מדכא LH, מעבה ריר צוואר הרחם ומשנה רירית", "מעלה LH", "מגביר מעבר זרע", "מעלה FSH"], "answer": 0, "explanation": "פרוגסטין פועל בכמה מנגנונים למניעת הריון."}, {"q": "איזה פרוגסטין מופיע בדור שני?", "options": ["Levonorgestrel", "Drospirenone", "Desogestrel", "Dienogest"], "answer": 0, "explanation": "Levonorgestrel מופיע בדור השני."}, {"q": "איזה פרוגסטין מופיע בדור שלישי?", "options": ["Desogestrel", "Levonorgestrel", "Norgestrel", "Drospirenone בלבד"], "answer": 0, "explanation": "Desogestrel מופיע בדור השלישי."}, {"q": "איזה פרוגסטין מופיע בדור רביעי?", "options": ["Drospirenone", "Levonorgestrel", "Norgestrel", "Gestodene בלבד"], "answer": 0, "explanation": "Drospirenone מופיע בדור הרביעי."}, {"q": "איזה יתרון נוסף מיוחס ל-Drospirenone?", "options": ["אפקט אנטי-אנדרוגני", "העלאת שיעור יתר", "הגברת ביוץ", "חסימת H1"], "answer": 0, "explanation": "המצגת מציינת תועלת באקנה וב-PMS."}, {"q": "איזה משטר גלולות נחשב מקוצר הפסקה?", "options": ["24/4", "21/7", "30/0", "7/21"], "answer": 0, "explanation": "משטר 24/4 מקצר את ההפסקה."}, {"q": "מהו יתרון אפשרי של משטר 24/4?", "options": ["פחות תנודות הורמונליות ופחות סיכון לשכחה", "יותר ביוץ", "יותר תופעות לוואי", "ביטול יעילות"], "answer": 0, "explanation": "המצגת מציינת פחות תנודות."}, {"q": "מהי NuvaRing?", "options": ["טבעת נרתיקית הורמונלית", "התקן נחושת", "זריקת ברזל", "חוסם H1"], "answer": 0, "explanation": "NuvaRing משחררת הורמונים דרך הנרתיק."}, {"q": "מהי EVRA?", "options": ["מדבקה הורמונלית", "גלולת חירום", "התקן נחושת", "זריקת פרוגסטרון"], "answer": 0, "explanation": "EVRA היא מדבקה הורמונלית."}, {"q": "למי מתאימה גלולת פרוגסטין בלבד?", "options": ["לנשים מניקות או כשאסטרוגן אינו מתאים", "רק לנשים מעל 60", "רק אחרי כימותרפיה", "רק עם אנמיה"], "answer": 0, "explanation": "המצגת מציינת התאמה בהנקה ובמצבים שבהם אסטרוגן אינו מתאים."}, {"q": "מה החיסרון המרכזי של Minipill?", "options": ["צורך בנטילה בשעה קבועה מאוד", "אין צורך בהתמדה", "גורמת תמיד לקרישיות", "אינה יעילה כלל"], "answer": 0, "explanation": "הדיוק בזמן הנטילה חשוב במיוחד."}, {"q": "מהו Depo-Provera?", "options": ["זריקת פרוגסטין כל 3 חודשים", "גלולה יומית משולבת", "התקן נחושת", "מדבקה שבועית"], "answer": 0, "explanation": "Depo-Provera ניתנת אחת לשלושה חודשים."}, {"q": "מהי תופעת לוואי חשובה של Depo-Provera?", "options": ["ירידה בצפיפות העצם", "עלייה חדה ב-B12", "אנפילקסיס קבוע", "שיפור מיידי בפוריות"], "answer": 0, "explanation": "המצגת מציינת ירידה בצפיפות העצם."}, {"q": "מהו התקן הורמונלי תוך רחמי?", "options": ["התקן שמשחרר Levonorgestrel מקומית", "התקן נחושת ללא הורמון", "גלולה משולבת", "זריקת אסטרוגן"], "answer": 0, "explanation": "Mirena ודומיו משחררים פרוגסטין מקומי."}, {"q": "מה מאפיין התקן נחושת?", "options": ["ללא הורמונים ופוגע בתנועת הזרע", "משחרר אסטרוגן", "מדכא LH דרך הדם", "מעלה ביוץ"], "answer": 0, "explanation": "התקן נחושת הוא אמצעי לא הורמונלי."}, {"q": "מהו אמצעי החירום היעיל יותר עד 5 ימים לפי המצגת?", "options": ["Ella", "גלולה משולבת רגילה", "Minipill", "NuvaRing"], "answer": 0, "explanation": "המצגת מציגה Ella כיעילה עד 120 שעות."}, {"q": "כיצד Ella פועלת?", "options": ["מעכבת או דוחה ביוץ באמצעות פעולה על רצפטור פרוגסטרון", "מעלה LH", "משחררת נחושת", "חוסמת H1"], "answer": 0, "explanation": "Ella פועלת כמודולטור של רצפטור פרוגסטרון."}, {"q": "באילו מצבים יש להימנע מאסטרוגן לפי המצגת?", "options": ["עישון מעל גיל 35 או סיכון קרישיות משמעותי", "כל אישה צעירה", "רק בזמן PMS", "רק בחסר ברזל"], "answer": 0, "explanation": "המצגת מדגישה סיכון קרישיות ומצבים שבהם אסטרוגן אינו מתאים."}];let questions=[],index=0,score=0,answered=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function startQuiz(){questions=JSON.parse(JSON.stringify(originalQuestions));shuffle(questions);questions.forEach(q=>{const c=q.options[q.answer];shuffle(q.options);q.answer=q.options.indexOf(c)});index=0;score=0;renderQuestion()}
function renderStart(){progressBar.style.width='0%';scoreText.textContent='מוכן להתחלה';slide.innerHTML=`<section class="start"><div class="kicker">תרגול אינטראקטיבי</div><h1>אמצעי מניעה</h1><p>20 שאלות על גלולות, פרוגסטינים, התקנים, מדבקה, טבעת וגלולות חירום.</p><button class="ctrl primary" onclick="startQuiz()">התחלת התרגול</button></section>`}
function renderQuestion(){answered=false;const q=questions[index],L=['א','ב','ג','ד'];scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;progressBar.style.width=`${index/questions.length*100}%`;slide.innerHTML=`<div class="kicker">שאלה ${index+1} מתוך ${questions.length}</div><h1>${q.q}</h1><div class="options">${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${L[i]}. ${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="ctrl secondary" onclick="renderStart()">התחלה מחדש</button><button class="ctrl primary" id="nextBtn" onclick="nextQuestion()" disabled>לשאלה הבאה</button></div>`}
function answer(choice){if(answered)return;answered=true;const q=questions[index],bs=[...document.querySelectorAll('.option')];bs.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct')});const ok=choice===q.answer;if(ok)score++;else bs[choice].classList.add('wrong');feedback.style.display='block';feedback.innerHTML=`<strong>${ok?'נכון מאוד!':'לא נכון'}</strong><br>${q.explanation}`;nextBtn.disabled=false;scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;progressBar.style.width=`${(index+1)/questions.length*100}%`}
function nextQuestion(){index++;index>=questions.length?finish():renderQuestion()}
function finish(){scoreText.textContent='התרגול הסתיים';progressBar.style.width='100%';slide.innerHTML=`<section class="finish"><div class="kicker">סיום התרגול</div><h1>כל הכבוד!</h1><div class="big-score">${score}/${questions.length}</div><button class="ctrl primary" onclick="startQuiz()">תרגול חדש</button></section>`}

document.addEventListener("keydown", function(e) {
  if (e.repeat) return;

  // Backspace = الرجوع للصفحة الرئيسية
  if (e.key === "Backspace") {
    e.preventDefault();
    window.location.href = "index.html";
    return;
  }

  // إذا انتهى الامتحان → Enter يبدأ امتحان جديد
  if (index >= questions.length) {
    if (e.key === "Enter") {
      startQuiz();
    }
    return;
  }

  // أثناء السؤال → 1-4 لاختيار الإجابة
  if (!answered) {
    if (e.key === "1") answer(0);
    else if (e.key === "2") answer(1);
    else if (e.key === "3") answer(2);
    else if (e.key === "4") answer(3);
  }

  // بعد الإجابة → Enter للسؤال التالي
  else if (e.key === "Enter") {
    nextQuestion();
  }
});

renderStart();
</script></body></html>
