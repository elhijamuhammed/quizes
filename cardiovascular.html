<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>חידון אינטראקטיבי – לחץ דם ואי־ספיקת לב</title>
<style>
:root{--bg:#06111f;--card:#102238;--text:#f7fbff;--muted:#a9bad0;--blue:#58c9ff;--gold:#ffc15d;--green:#35d07f;--red:#ff6b79;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(88,201,255,.13),transparent 30%),radial-gradient(circle at 90% 90%,rgba(255,193,93,.1),transparent 30%),var(--bg)}
.app{max-width:980px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px}
.brand{font-weight:900;font-size:18px}.status{color:var(--muted);font-weight:700;text-align:left}
.progress{height:10px;border-radius:999px;background:#071827;overflow:hidden;margin-bottom:18px}
.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:.3s}
.card{min-height:650px;border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,46px);background:linear-gradient(145deg,rgba(16,34,56,.98),rgba(10,24,41,.98));box-shadow:0 25px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:center}
.kicker{color:var(--gold);font-weight:900;margin-bottom:12px}
h1{font-size:clamp(25px,4vw,40px);line-height:1.45;margin:0 0 24px}
.intro{text-align:center}.intro h1,.finish h1{font-size:clamp(34px,6vw,58px)}
.intro p,.finish p{color:var(--muted);font-size:18px;line-height:1.8}
.options{display:grid;gap:13px}
.option{width:100%;border:1px solid var(--line);background:#0a1a2d;color:var(--text);padding:16px 18px;border-radius:15px;text-align:right;font-size:17px;line-height:1.55;cursor:pointer;transition:.18s}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue)}
.option.correct{border-color:var(--green);background:rgba(53,208,127,.17)}
.option.wrong{border-color:var(--red);background:rgba(255,107,121,.17)}
.option:disabled{cursor:default}
.feedback{display:none;margin-top:20px;padding:18px 20px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.055);line-height:1.75}
.feedback strong{font-size:19px}
.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
button.ctrl{border:0;border-radius:13px;padding:13px 19px;font-size:16px;font-weight:900;cursor:pointer}
.primary{background:var(--blue);color:#06111e}.secondary{background:#18304d;color:var(--text);border:1px solid var(--line)!important}
button:disabled{opacity:.45;cursor:not-allowed}
.big-score{font-size:76px;color:var(--gold);font-weight:950;margin:12px}
.finish{text-align:center}
.mistakes{margin-top:20px;text-align:right;display:grid;gap:10px}
.mistake{background:rgba(255,255,255,.05);border:1px solid var(--line);padding:13px;border-radius:12px;line-height:1.55}
.note{font-size:14px;color:var(--muted);margin-top:18px}
@media(max-width:600px){.app{padding:9px}.card{min-height:calc(100vh - 75px);border-radius:19px;padding:19px}.option{font-size:16px;padding:14px}.top{font-size:14px}}

.menu-home{
  position:fixed;
  left:18px;
  bottom:18px;
  z-index:9999;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:11px 15px;
  border-radius:12px;
  background:#162a45;
  color:#f7fbff;
  border:1px solid rgba(255,255,255,.16);
  text-decoration:none;
  font-family:Arial,sans-serif;
  font-weight:800;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.menu-home:hover{transform:translateY(-2px)}
@media(max-width:600px){.menu-home{left:10px;bottom:10px;padding:9px 12px;font-size:14px}}

</style></head>

<div class="progress"><div id="bar"></div></div>
<main id="card" class="card"></main>
</div>

וסמי בטא מפחיתים קצב לב ועוצמת התכווצות."}];
const QUESTIONS_PER_ROUND=20;
let questions=[],index=0,score=0,answered=false,mistakes=[];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function prepare(){
  questions=JSON.parse(JSON.stringify(bank));
  shuffle(questions);
  questions=questions.slice(0,Math.min(QUESTIONS_PER_ROUND,questions.length));
  questions.forEach(q=>{const correct=q.options[q.answer];shuffle(q.options);q.answer=q.options.indexOf(correct)});
  index=0;score=0;answered=false;mistakes=[];renderQuestion();
}
function startScreen(){
  bar.style.width='0%';status.textContent='מוכן להתחלה';
  card.innerHTML=`<section class="intro"><div class="kicker">תרגול אינטראקטיבי</div><h1>לחץ דם, תרופות ואי־ספיקת לב</h1><p>בכל סבב יוצגו 20 שאלות אקראיות מתוך מאגר של ${bank.length} שאלות. אחרי כל תשובה יוצגו הפתרון והסבר.</p><button class="ctrl primary" onclick="prepare()">התחלת התרגול</button><div class="note">סדר השאלות והתשובות משתנה בכל סבב</div></section>`;
}
function renderQuestion(){
  answered=false;const q=questions[index],letters=['א','ב','ג','ד'];
  status.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;
  bar.style.width=`${index/questions.length*100}%`;
  card.innerHTML=`<div class="kicker">שאלה ${index+1} מתוך ${questions.length}</div><h1>${q.q}</h1><div class="options">${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${letters[i]}. ${o}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="actions"><button class="ctrl secondary" onclick="startScreen()">חזרה להתחלה</button><button id="next" class="ctrl primary" onclick="nextQuestion()" disabled>לשאלה הבאה</button></div>`;
}
function answer(choice){
  if(answered)return;answered=true;
  const q=questions[index],buttons=[...document.querySelectorAll('.option')];
  buttons.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct')});
  const ok=choice===q.answer;
  if(ok)score++;else{buttons[choice].classList.add('wrong');mistakes.push({q:q.q,correct:q.options[q.answer],explanation:q.explanation})}
  feedback.style.display='block';
  feedback.innerHTML=`<strong>${ok?'נכון מאוד!':'לא נכון'}</strong><br>${q.explanation}`;
  next.disabled=false;
  status.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;
  bar.style.width=`${(index+1)/questions.length*100}%`;
}
function nextQuestion(){if(!answered)return;index++;index>=questions.length?finish():renderQuestion()}
function finish(){
  const pct=Math.round(score/questions.length*100);
  const msg=pct>=90?'מצוין! שליטה חזקה מאוד בחומר.':pct>=75?'טוב מאוד! נשארה חזרה קצרה.':pct>=60?'בסדר גמור, כדאי לעבור על הטעויות.':'כדאי לחזור על המצגת ולנסות שוב.';
  status.textContent='התרגול הסתיים';bar.style.width='100%';
  const review=mistakes.length?`<div class="mistakes"><h2>חזרה על טעויות</h2>${mistakes.map(m=>`<div class="mistake"><strong>${m.q}</strong><br>התשובה הנכונה: ${m.correct}<br>${m.explanation}</div>`).join('')}</div>`:'<p>לא היו טעויות בסבב הזה.</p>';
  card.innerHTML=`<section class="finish"><div class="kicker">סיום התרגול</div><h1>כל הכבוד!</h1><div class="big-score">${score}/${questions.length}</div><p>${msg}</p><button class="ctrl primary" onclick="prepare()">סבב חדש</button>${review}</section>`;
}

// ===== Keyboard shortcuts =====
// 1-4: choose answer
// Enter: next question
// Enter on finish screen: new quiz
// Backspace: return to index.html
document.addEventListener("keydown", function (e) {
  if (e.repeat) return;

  // Backspace -> main menu
  if (e.key === "Backspace") {
    e.preventDefault();
    window.location.href = "index.html";
    return;
  }

  // Finish screen -> Enter starts a new quiz
  if (document.querySelector(".finish")) {
    if (e.key === "Enter") {
      e.preventDefault();
      prepare();
    }
    return;
  }

  // While a question is shown -> 1,2,3,4 select answers
  const optionButtons = document.querySelectorAll(".option");
  if (!answered && optionButtons.length > 0) {
    const keyMap = {
      "1": 0,
      "2": 1,
      "3": 2,
      "4": 3
    };

    if (Object.prototype.hasOwnProperty.call(keyMap, e.key)) {
      e.preventDefault();
      const choice = keyMap[e.key];

      if (optionButtons[choice] && !optionButtons[choice].disabled) {
        answer(choice);
      }
      return;
    }
  }

  // After answering -> Enter goes to next question
  if (answered && e.key === "Enter") {
    e.preventDefault();
    nextQuestion();
  }
});

startScreen();
