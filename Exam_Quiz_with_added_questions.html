<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חידון תרגול לבחינה</title>
<style>
  :root{
    --paper:#f6f4ee;
    --ink:#20261f;
    --ink-soft:#5c6459;
    --line:#d8d3c4;
    --accent:#2e5c4d;
    --accent-soft:#e4ede8;
    --good:#2e5c4d;
    --good-soft:#e4ede8;
    --bad:#a83d2d;
    --bad-soft:#f6e2dd;
    --flag:#a85b2d;
    --card:#ffffff;
    --serif: "Frank Ruhl Libre", "David Libre", Georgia, serif;
    --sans: "Assistant", "Segoe UI", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    min-height:100vh;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:32px 20px 60px;
  }

  /* ---- setup screen ---- */
  .eyebrow{
    font-size:13px;
    letter-spacing:.12em;
    color:var(--accent);
    font-weight:700;
    margin-bottom:8px;
  }
  h1{
    font-family:var(--serif);
    font-size:clamp(28px,6vw,38px);
    margin:0 0 10px;
    font-weight:700;
  }
  .lead{
    color:var(--ink-soft);
    font-size:15.5px;
    max-width:52ch;
    margin:0 0 28px;
  }
  .setup-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:24px;
  }
  .setup-card label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    margin:18px 0 8px;
  }
  .setup-card label:first-of-type{margin-top:0;}
  select, .num-input{
    width:100%;
    padding:11px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    font-family:var(--sans);
    font-size:15px;
    color:var(--ink);
  }
  .chip-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .chip{
    padding:8px 16px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:14px;
    cursor:pointer;
    color:var(--ink-soft);
    font-weight:600;
  }
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .start-btn{
    width:100%;
    margin-top:26px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-family:var(--sans);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .start-btn:hover{background:#254c40;}
  .setup-note{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:14px;
  }

  /* ---- quiz screen ---- */
  #quiz-screen{display:none;}
  .quiz-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .progress-bar{
    height:6px;
    background:var(--line);
    border-radius:6px;
    overflow:hidden;
    margin-bottom:26px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .3s ease;
  }
  .q-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 24px;
  }
  .q-topic{
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    letter-spacing:.04em;
    margin-bottom:10px;
  }
  .q-text{
    font-family:var(--serif);
    font-size:19px;
    font-weight:700;
    margin:0 0 20px;
    line-height:1.4;
  }
  .choices{
    display:grid;
    gap:10px;
  }
  .choice-btn{
    text-align:right;
    padding:13px 16px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--paper);
    font-family:var(--sans);
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    gap:10px;
  }
  .choice-btn:hover:not(:disabled){border-color:var(--accent);}
  .choice-btn .letter{font-weight:700; color:var(--accent);}
  .choice-btn:disabled{cursor:default;}
  .choice-btn.chosen-correct{
    background:var(--good-soft);
    border-color:var(--good);
    color:var(--good);
    font-weight:700;
  }
  .choice-btn.chosen-wrong{
    background:var(--bad-soft);
    border-color:var(--bad);
    color:var(--bad);
    font-weight:700;
  }
  .choice-btn.reveal-correct{
    background:var(--good-soft);
    border-color:var(--good);
  }
  .flag-note{
    margin-top:16px;
    background:#f4e6da;
    border-inline-start:3px solid var(--flag);
    padding:9px 13px;
    font-size:13px;
    color:#6b3a1c;
    border-radius:4px;
  }
  .feedback-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
  }
  .feedback-text{
    font-size:14px;
    font-weight:700;
  }
  .feedback-text.good{color:var(--good);}
  .feedback-text.bad{color:var(--bad);}
  .next-btn{
    padding:11px 22px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    font-family:var(--sans);
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    display:none;
  }
  .next-btn.show{display:inline-block;}

  /* ---- results screen ---- */
  #results-screen{display:none;}
  .score-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:36px 28px;
    text-align:center;
  }
  .score-big{
    font-family:var(--serif);
    font-size:56px;
    font-weight:700;
    color:var(--accent);
    margin:6px 0;
  }
  .score-sub{
    color:var(--ink-soft);
    font-size:15px;
    margin-bottom:24px;
  }
  .restart-btn{
    padding:13px 26px;
    border:1px solid var(--accent);
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    font-family:var(--sans);
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin:6px;
  }
  .restart-btn.secondary{
    background:var(--card);
    color:var(--accent);
  }
  .review-list{
    margin-top:28px;
    text-align:right;
  }
  .review-item{
    background:var(--card);
    border:1px solid var(--line);
    border-inline-start:4px solid var(--bad);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:10px;
    font-size:14px;
  }
  .review-item .rq{font-weight:700; margin-bottom:6px;}
  .review-item .ra{color:var(--bad);}
  .review-item .rc{color:var(--good); margin-top:3px;}
  .review-heading{
    font-family:var(--serif);
    font-size:20px;
    margin:36px 0 14px;
  }

  @media (max-width:480px){
    .wrap{padding:22px 14px 50px;}
    .q-card{padding:20px 18px;}
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- SETUP -->
  <div id="setup-screen">
    <div class="eyebrow">חידון תרגול</div>
    <h1>מוכנים לבדוק את עצמכם?</h1>
    <p class="lead">93 שאלות אמריקאיות מהבחינה ומהתמונות, מסודרות לפי נושא. בחרו נושא, מספר שאלות וסדר, ותתחילו.</p>

    <div class="setup-card">
      <label>נושא</label>
      <select id="topic-select"></select>

      <label>כמות שאלות</label>
      <div class="chip-row" id="count-chips">
        <div class="chip" data-count="10">10</div>
        <div class="chip" data-count="20">20</div>
        <div class="chip active" data-count="all">הכל</div>
      </div>

      <label>סדר שאלות</label>
      <div class="chip-row" id="order-chips">
        <div class="chip active" data-order="sequential">לפי סדר</div>
        <div class="chip" data-order="shuffle">אקראי</div>
      </div>

      <button class="start-btn" id="start-btn">התחל חידון</button>
      <div class="setup-note" id="count-note"></div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz-screen">
    <div class="quiz-top">
      <span id="progress-label">שאלה 1 מתוך 10</span>
      <span id="score-label">ניקוד: 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="q-card">
      <div class="q-topic" id="q-topic"></div>
      <div class="q-text" id="q-text"></div>
      <div class="choices" id="choices"></div>
      <div class="flag-note" id="flag-note" style="display:none;"></div>
      <div class="feedback-row">
        <span class="feedback-text" id="feedback-text"></span>
        <button class="next-btn" id="next-btn">השאלה הבאה →</button>
      </div>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="results-screen">
    <div class="score-card">
      <div class="eyebrow">סיימתם!</div>
      <div class="score-big" id="final-score">0/0</div>
      <div class="score-sub" id="final-pct">0% תשובות נכונות</div>
      <button class="restart-btn" id="retry-btn">נסו שוב</button>
      <button class="restart-btn secondary" id="new-quiz-btn">חידון חדש</button>
    </div>
    <div id="review-wrap"></div>
  </div>

</div>

<script>
const DATA = [
{ section: "פרמקוקינטיקה ואינטראקציות תרופתיות", questions: [

  {n:23, q:"תמ\"ל AR מיועד בעיקר ל:", opts:["אלרגיה","רפלוקס","פגים","חוסר ברזל"], correct:1},
]},
{ section: "טיפול בפצעים והומאופתיה", questions: [
  {n:25, q:"מיתוס נפוץ בטיפול בפצעים הוא:", opts:["מריחה ללא שטיפה","פצע צריך אוויר כדי להחלים","יש לנקות פצע","יש למנוע זיהום"], correct:1},

  document.querySelectorAll('#order-chips .chip').forEach(c=>c.classList.remove('active'));
  e.target.classList.add('active');
  selectedOrder = e.target.dataset.order;
});

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let quizQuestions = [];
let currentIndex = 0;
let score = 0;
let wrongAnswers = [];
let answeredThisQ = false;

const setupScreen = document.getElementById('setup-screen');
const quizScreen = document.getElementById('quiz-screen');
const resultsScreen = document.getElementById('results-screen');

function buildQuiz(){
  let pool = topicSelect.value === 'all' ? ALL_Q : ALL_Q.filter(q => q.section === topicSelect.value);
  pool = selectedOrder === 'shuffle' ? shuffle(pool) : [...pool];
  if(selectedCount !== 'all'){
    pool = pool.slice(0, parseInt(selectedCount));
  }
  return pool;
}

document.getElementById('start-btn').addEventListener('click', () => {
  quizQuestions = buildQuiz();
  if(quizQuestions.length === 0) return;
  currentIndex = 0;
  score = 0;
  wrongAnswers = [];
  setupScreen.style.display = 'none';
  quizScreen.style.display = 'block';
  resultsScreen.style.display = 'none';
  renderQuestion();
});

function renderQuestion(){
  answeredThisQ = false;
  const item = quizQuestions[currentIndex];
  document.getElementById('progress-label').textContent = `שאלה ${currentIndex+1} מתוך ${quizQuestions.length}`;
  document.getElementById('score-label').textContent = `ניקוד: ${score}`;
  document.getElementById('progress-fill').style.width = `${(currentIndex/quizQuestions.length)*100}%`;
  document.getElementById('q-topic').textContent = item.section;
  document.getElementById('q-text').textContent = `${item.n}. ${item.q}`;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  item.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="letter">${LETTERS[i]}.</span><span>${opt}</span>`;
    btn.addEventListener('click', () => selectAnswer(i));
    choicesEl.appendChild(btn);
  });

  const flagNote = document.getElementById('flag-note');
  if(item.flag){
    flagNote.style.display = 'block';
    flagNote.textContent = `⚠ ${item.flag}`;
  } else {
    flagNote.style.display = 'none';
  }

  document.getElementById('feedback-text').textContent = '';
  document.getElementById('feedback-text').className = 'feedback-text';
  document.getElementById('next-btn').classList.remove('show');
}

function selectAnswer(i){
  if(answeredThisQ) return;
  answeredThisQ = true;
  const item = quizQuestions[currentIndex];
  const buttons = document.querySelectorAll('.choice-btn');
  buttons.forEach(b => b.disabled = true);

  const isCorrect = i === item.correct;
  if(isCorrect){
    score++;
    buttons[i].classList.add('chosen-correct');
    document.getElementById('feedback-text').textContent = 'נכון! ✓';
    document.getElementById('feedback-text').className = 'feedback-text good';
  } else {
    buttons[i].classList.add('chosen-wrong');
    buttons[item.correct].classList.add('reveal-correct');
    document.getElementById('feedback-text').textContent = `לא נכון — התשובה: ${LETTERS[item.correct]}. ${item.opts[item.correct]}`;
    document.getElementById('feedback-text').className = 'feedback-text bad';
    wrongAnswers.push({
      n: item.n,
      q: item.q,
      chosen: `${LETTERS[i]}. ${item.opts[i]}`,
      correct: `${LETTERS[item.correct]}. ${item.opts[item.correct]}`
    });
  }
  document.getElementById('score-label').textContent = `ניקוד: ${score}`;
  document.getElementById('next-btn').classList.add('show');
}

document.getElementById('next-btn').addEventListener('click', () => {
  currentIndex++;
  if(currentIndex >= quizQuestions.length){
    showResults();
  } else {
    renderQuestion();
  }
});

function showResults(){
  quizScreen.style.display = 'none';
  resultsScreen.style.display = 'block';
  const total = quizQuestions.length;
  const pct = Math.round((score/total)*100);
  document.getElementById('final-score').textContent = `${score}/${total}`;
  document.getElementById('final-pct').textContent = `${pct}% תשובות נכונות`;

  const reviewWrap = document.getElementById('review-wrap');
  reviewWrap.innerHTML = '';
  if(wrongAnswers.length > 0){
    const heading = document.createElement('div');
    heading.className = 'review-heading';
    heading.textContent = 'שאלות לחזרה';
    reviewWrap.appendChild(heading);
    const list = document.createElement('div');
    list.className = 'review-list';
    wrongAnswers.forEach(w => {
      const div = document.createElement('div');
      div.className = 'review-item';
      div.innerHTML = `
        <div class="rq">${w.n}. ${w.q}</div>
        <div class="ra">התשובה שלכם: ${w.chosen}</div>
        <div class="rc">התשובה הנכונה: ${w.correct}</div>
      `;
      list.appendChild(div);
    });
    reviewWrap.appendChild(list);
  }
}

document.getElementById('retry-btn').addEventListener('click', () => {
  currentIndex = 0;
  score = 0;
  wrongAnswers = [];
  resultsScreen.style.display = 'none';
  quizScreen.style.display = 'block';
  renderQuestion();
});

document.getElementById('new-quiz-btn').addEventListener('click', () => {
  resultsScreen.style.display = 'none';
  setupScreen.style.display = 'block';
});
</script>
</body>
</html>
