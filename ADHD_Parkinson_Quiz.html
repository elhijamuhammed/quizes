<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADHD ופרקינסון</title>
<style>
:root{--bg:#07111f;--card:#101f34;--text:#f7fbff;--muted:#a8bad0;--blue:#55c7ff;--gold:#ffbd59;--green:#2ecc71;--red:#ff6672;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:var(--bg)}.app{max-width:950px;margin:auto;padding:78px 20px 24px}.topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.brand{font-weight:900}.score{color:var(--muted);font-weight:700}.progress{height:10px;background:#081522;border-radius:999px;overflow:hidden;margin-bottom:18px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:.35s}.slide{min-height:620px;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:clamp(22px,5vw,46px);display:flex;flex-direction:column;justify-content:center}.kicker{color:var(--gold);font-weight:900;margin-bottom:12px}h1{font-size:clamp(25px,4vw,40px);line-height:1.45;margin:0 0 25px}.start,.finish{text-align:center}.start p,.finish p{color:var(--muted);font-size:18px;line-height:1.8}.options{display:grid;gap:13px}.option{border:1px solid var(--border);background:#0b192b;color:var(--text);padding:16px 18px;border-radius:15px;text-align:right;font-size:17px;cursor:pointer}.option.correct{border-color:var(--green);background:rgba(46,204,113,.17)}.option.wrong{border-color:var(--red);background:rgba(255,102,114,.17)}.feedback{display:none;margin-top:22px;border-radius:18px;padding:18px 20px;line-height:1.7;background:rgba(255,255,255,.06);border:1px solid var(--border)}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}button.ctrl{border:0;border-radius:13px;padding:13px 19px;font-size:16px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#06111e}.secondary{background:#162a45;color:var(--text)}button:disabled{opacity:.45}.big-score{font-size:76px;font-weight:950;color:var(--gold)}.menu-home{position:fixed;top:18px;left:18px;padding:12px 17px;border-radius:13px;background:#162a45;color:#fff;text-decoration:none;font-weight:900}@media(max-width:600px){.app{padding:68px 10px 10px}.slide{min-height:calc(100vh - 115px);border-radius:20px;padding:20px}}
</style></head><body><a class="menu-home" href="index.html">← חזרה לתפריט</a><div class="app"><div class="topbar"><div class="brand">ADHD ופרקינסון</div><div class="score" id="scoreText">מוכן להתחלה</div></div><div class="progress"><div id="progressBar"></div></div><main class="slide" id="slide"></main></div>
<script>
const originalQuestions=[{"q": "כיצד מוגדרת הפרעת קשב וריכוז ADHD על פי המצגת?", "options": ["הפרעה נוירו־התפתחותית המאופיינת בחוסר קשב ו/או היפראקטיביות ואימפולסיביות", "ליקוי למידה זמני החולף עד סוף גיל ההתבגרות", "בעיה התנהגותית הנובעת רק מחינוך לא נכון", "הפרעה נפשית הנגרמת מחשיפה למסכים ותזונה עתירת סוכר"], "answer": 0, "explanation": "ADHD היא הפרעה נוירו־התפתחותית המתבטאת בחוסר קשב ו/או היפראקטיביות ואימפולסיביות."}, {"q": "מהי שכיחות ADHD בקרב מבוגרים לפי המצגת?", "options": ["מעל 15%", "כמעט אפס", "כ־4%–7%", "בדיוק 10%"], "answer": 2, "explanation": "לפי המצגת, כ־4%–7% מהמבוגרים סובלים מהפרעת קשב."}, {"q": "מדוע חשוב לבצע בדיקות שמיעה וראייה לפני קביעת אבחנה של ADHD?", "options": ["כדי לשלול מצבים רפואיים אחרים שעלולים לגרום לתסמינים דומים", "כדי לוודא שהמטופל יודע לקרוא שאלונים", "כי סטימולנטים תמיד מחמירים שמיעה וראייה", "כי הבדיקות הן חלק ממבחן TOVA"], "answer": 0, "explanation": "הבדיקות מסייעות לשלול גורמים אחרים שעלולים להיראות כמו חוסר קשב."}, {"q": "מהי מטרת הטיפול התרופתי ב-ADHD מבחינה פיזיולוגית?", "options": ["לחסום קולטני דופמין", "לדכא את פעילות המוח", "לנרמל רמות דופמין ונוראדרנלין במסלולים מרכזיים כמו הקורטקס הקדם־מצחי", "להגביר רק סרוטונין"], "answer": 2, "explanation": "הטיפול נועד לנרמל פעילות דופמינרגית ונוראדרנרגית באזורים הקשורים לקשב ולוויסות."}, {"q": "מה מייחד את מנגנון הפעולה של אמפטמינים לעומת מתילפנידאט?", "options": ["הם גם מגבירים שחרור דופמין וגם מפחיתים את פירוקו, בנוסף לעיכוב משאבות", "הם פועלים רק על DAT ו-NAT", "הם אינם סטימולנטים", "הם פועלים רק במערכת ההורמונלית"], "answer": 0, "explanation": "לפי המצגת, אמפטמינים פועלים בכמה מנגנונים: עיכוב נשאים, הגברת שחרור והפחתת פירוק."}, {"q": "מדוע ריסוק טבליית Concerta פוגע ביעילותה המיוחדת?", "options": ["כי החומר הפעיל מתחמצן והופך לרעיל", "כי מנגנון השחרור המושהה תלוי בלחץ אוסמוטי בתוך מבנה שלם", "כי הריסוק מונע התמוססות ג'לטין", "הריסוק אינו משנה דבר"], "answer": 1, "explanation": "Concerta משתמשת במנגנון שחרור אוסמוטי, ולכן שלמות הטבלייה חיונית."}, {"q": "איזו אזהרה חמורה קיימת לגבי Atomoxetine בילדים ומתבגרים?", "options": ["עלייה במחשבות אובדניות וניסיונות התאבדות", "עיוורון לילה", "סיכון התמכרות גבוה יותר מסטימולנטים", "נסיגת חניכיים"], "answer": 0, "explanation": "יש לעקוב אחר הופעת מחשבות אובדניות ושינויים התנהגותיים."}, {"q": "מהו הקשר בין טיפול נכון בסטימולנטים לבין הפרעות שימוש בחומרים?", "options": ["רק טיפול לא תרופתי מפחית סיכון", "אין כל קשר", "ריטלין מגביר חיפוש אחר סמים", "טיפול נכון עשוי להפחית את הסיכון להתפתחות הפרעות שימוש בחומרים"], "answer": 3, "explanation": "לפי המצגת, טיפול נכון בסטימולנטים עשוי להפחית שכיחות של SUD בעתיד."}, {"q": "מה נאמר במצגת על תוספי תזונה וטיפולים משלימים ב-ADHD?", "options": ["אף טיפול משלים לא הראה יעילות גבוהה בפני עצמו, אך ניתן לשלב כתוספת", "אומגה 3 מחליפה לחלוטין ריטלין", "פורמולות ריכוזית הן הטיפול הטוב ביותר", "פעילות גופנית ושינה אינן משפיעות"], "answer": 0, "explanation": "טיפולים משלימים אינם תחליף לטיפול הסטנדרטי, אך ניתן לשלבם כתוספת."}, {"q": "מדוע חשוב לבצע ירידה הדרגתית במינון לפני הפסקת סטימולנטים?", "options": ["רק בתרופות בשחרור מיידי", "כדי לאפשר לוויטמינים לפעול", "כדי למנוע תופעות לוואי או תגובות גמילה לא רצויות", "כדי למנוע מכירת כדורים"], "answer": 2, "explanation": "הפחתה הדרגתית מסייעת למנוע תסמיני גמילה או תגובות לא רצויות."}, {"q": "באיזה אזור במוח מתרחש הניוון העיקרי של נוירונים דופמינרגיים בפרקינסון?", "options": ["Substantia nigra", "Hippocampus", "Cerebellum", "Prefrontal cortex"], "answer": 0, "explanation": "הניוון המרכזי מתרחש בגרעין השחור, Substantia nigra."}, {"q": "איזו ירידה במספר הנוירונים הדופמינרגיים קיימת בדרך כלל כאשר מופיעים התסמינים הראשונים?", "options": ["50%–60%", "10%–20%", "אין ירידה במספר", "90%"], "answer": 0, "explanation": "לפי המצגת, עם הופעת התסמינים כבר קיימת ירידה של כ־50%–60%."}, {"q": "מהי אקינזיה (Akinesia) לפי מודל RAFT?", "options": ["פנים קפואות", "נוקשות והתנגדות לתנועה פסיבית", "אובדן יכולת להזיז שרירים או תנועה איטית מאוד", "רעד בלתי נשלט באצבעות"], "answer": 2, "explanation": "אקינזיה היא קושי להתחיל תנועה, אובדן תנועה או תנועה איטית מאוד."}, {"q": "איזה תסמין לא־מוטורי עשוי להופיע שנים לפני התסמינים המוטוריים?", "options": ["Rolling pill tremor", "אובדן חוש הריח", "חוסר יציבות", "נוקשות בגפיים"], "answer": 1, "explanation": "אובדן חוש הריח עשוי להיות תסמין מוקדם מאוד."}, {"q": "מהו גורם הסיכון המשמעותי ביותר להתפתחות מחלת פרקינסון?", "options": ["חשיפה לכספית", "גיל מתקדם", "גורמים גנטיים בלבד", "שתיית מי באר"], "answer": 1, "explanation": "הגיל המתקדם הוא גורם הסיכון המרכזי לפי החומר."}, {"q": "מדוע משתמשים ב-Levodopa ולא ב-Dopamine עצמו?", "options": ["כי דופמין יוצר אינטראקציות מזון רבות", "כי דופמין אינו חוצה את מחסום הדם־מוח", "כי Levodopa מרפאה את המחלה", "כי דופמין רעיל לשרירים"], "answer": 1, "explanation": "דופמין אינו חוצה BBB, בעוד Levodopa כן יכולה להגיע למוח ולהפוך שם לדופמין."}, {"q": "איזו תופעת לוואי ייחודית חשובה באגוניסטים לדופמין כמו Requip?", "options": ["ירידה בלחץ דם ריאתי", "עלייה דרמטית במשקל", "התקפי שינה פתאומיים", "אובדן חוש הטעם"], "answer": 2, "explanation": "אגוניסטים לדופמין עלולים לגרום להתקפי שינה פתאומיים."}, {"q": "מהו ההבדל בין פרקינסוניזם למחלת פרקינסון?", "options": ["בפרקינסוניזם אין רעד לעולם", "פרקינסוניזם הוא שלב מוקדם של פרקינסון", "פרקינסוניזם הוא אוסף תסמינים מוטוריים, בעוד פרקינסון היא מחלה הכוללת גם תסמינים לא־מוטוריים", "פרקינסוניזם מופיע רק בגברים"], "answer": 2, "explanation": "פרקינסוניזם הוא תיאור של תסמינים מוטוריים; מחלת פרקינסון היא מחלה רחבה יותר."}, {"q": "מאיזה מרכיב תזונתי יש להיזהר עם מעכבי MAO-B כמו Azilect או Selegiline?", "options": ["Tyramine", "Vitamin C", "Gluten", "Lactose"], "answer": 0, "explanation": "לפי המצגת יש להיזהר מטיראמין בעת שימוש במעכבי MAO-B."}, {"q": "מהי מטרת מתן מעכבים אנזימטיים יחד עם Levodopa?", "options": ["למנוע הזיות ופסיכוזה", "לרפא נוירונים שמתו", "לשפר חוש ריח", "להאריך את משך פעילות Levodopa ולמנוע פירוק לפני הגעתה למוח"], "answer": 3, "explanation": "מעכבי COMT או Dopa-decarboxylase מפחיתים פירוק פריפרי ומאריכים את השפעת Levodopa."}];let questions=[],index=0,score=0,answered=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function startQuiz(){questions=JSON.parse(JSON.stringify(originalQuestions));shuffle(questions);questions.forEach(q=>{const c=q.options[q.answer];shuffle(q.options);q.answer=q.options.indexOf(c)});index=0;score=0;renderQuestion()}
function renderStart(){progressBar.style.width='0%';scoreText.textContent='מוכן להתחלה';slide.innerHTML=`<section class="start"><div class="kicker">תרגול אינטראקטיבי</div><h1>ADHD ופרקינסון</h1><p>20 שאלות: 10 בנושא ADHD ו-10 בנושא פרקינסון.</p><button class="ctrl primary" onclick="startQuiz()">התחלת התרגול</button></section>`}
function renderQuestion(){answered=false;const q=questions[index],L=['א','ב','ג','ד'];scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;progressBar.style.width=`${index/questions.length*100}%`;slide.innerHTML=`<div class="kicker">שאלה ${index+1} מתוך ${questions.length}</div><h1>${q.q}</h1><div class="options">${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${L[i]}. ${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="ctrl secondary" onclick="renderStart()">התחלה מחדש</button><button class="ctrl primary" id="nextBtn" onclick="nextQuestion()" disabled>לשאלה הבאה</button></div>`}
function answer(choice){if(answered)return;answered=true;const q=questions[index],bs=[...document.querySelectorAll('.option')];bs.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct')});const ok=choice===q.answer;if(ok)score++;else bs[choice].classList.add('wrong');feedback.style.display='block';feedback.innerHTML=`<strong>${ok?'נכון מאוד!':'לא נכון'}</strong><br>${q.explanation}`;nextBtn.disabled=false;scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;progressBar.style.width=`${(index+1)/questions.length*100}%`}
function nextQuestion(){index++;index>=questions.length?finish():renderQuestion()}
function finish(){scoreText.textContent='התרגול הסתיים';progressBar.style.width='100%';slide.innerHTML=`<section class="finish"><div class="kicker">סיום התרגול</div><h1>כל הכבוד!</h1><div class="big-score">${score}/${questions.length}</div><p>אפשר להתחיל שוב ולקבל סדר חדש.</p><button class="ctrl primary" onclick="startQuiz()">תרגול חדש</button></section>`}

// Keyboard shortcuts: 1-4 = answer, Enter = next question
document.addEventListener("keydown", function(e) {
  if (e.repeat) return;

  // Backspace = الرجوع للصفحة الرئيسية
  if (e.key === "Backspace") {
    e.preventDefault();
    window.location.href = "index.html";
    return;
  }

  // إذا انتهى الامتحان → Enter يبدأ امتحان جديد
  if (index >= questions.length) {
    if (e.key === "Enter") {
      startQuiz();
    }
    return;
  }

  // أثناء السؤال → 1-4 لاختيار الإجابة
  if (!answered) {
    if (e.key === "1") answer(0);
    else if (e.key === "2") answer(1);
    else if (e.key === "3") answer(2);
    else if (e.key === "4") answer(3);
  }

  // بعد الإجابة → Enter للسؤال التالي
  else if (e.key === "Enter") {
    nextQuestion();
  }
});
renderStart();

</script></body></html>
