<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>חידון אנטיביוטיקה</title>
<style>
:root{--bg:#07111f;--card:#101f34;--text:#f7fbff;--muted:#a8bad0;--blue:#55c7ff;--gold:#ffbd59;--green:#2ecc71;--red:#ff6672;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(85,199,255,.14),transparent 28%),radial-gradient(circle at 90% 90%,rgba(255,189,89,.10),transparent 28%),var(--bg)}
.app{max-width:950px;margin:auto;padding:78px 20px 24px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}
.brand{font-weight:900;font-size:18px}
.score{color:var(--muted);font-weight:700}
.progress{height:10px;background:#081522;border-radius:999px;overflow:hidden;margin-bottom:18px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:.35s}
.slide{min-height:620px;background:linear-gradient(145deg,rgba(16,31,52,.98),rgba(11,24,41,.98));border:1px solid var(--border);border-radius:28px;padding:clamp(22px,5vw,46px);display:flex;flex-direction:column;justify-content:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.kicker{color:var(--gold);font-weight:900;margin-bottom:12px}
h1{font-size:clamp(25px,4vw,40px);line-height:1.45;margin:0 0 25px}
.start,.finish{text-align:center}
.start p,.finish p{color:var(--muted);font-size:18px;line-height:1.8}
.options{display:grid;gap:13px}
.option{border:1px solid var(--border);background:#0b192b;color:var(--text);padding:16px 18px;border-radius:15px;text-align:right;font-size:17px;line-height:1.55;cursor:pointer;transition:.2s}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue);background:#10223b}
.option.correct{border-color:var(--green);background:rgba(46,204,113,.17)}
.option.wrong{border-color:var(--red);background:rgba(255,102,114,.17)}
.option:disabled{cursor:default}
.feedback{display:none;margin-top:22px;border-radius:18px;padding:18px 20px;line-height:1.7;background:rgba(255,255,255,.06);border:1px solid var(--border)}
.feedback.good{border-color:rgba(46,204,113,.55)} .feedback.bad{border-color:rgba(255,102,114,.55)}
.feedback-title{font-weight:900;font-size:19px;margin-bottom:6px}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
button.ctrl{border:0;border-radius:13px;padding:13px 19px;font-size:16px;font-weight:900;cursor:pointer}
.primary{background:var(--blue);color:#06111e} .secondary{background:#162a45;color:var(--text);border:1px solid var(--border)!important}
button.ctrl:disabled{opacity:.45;cursor:not-allowed}
.big-score{font-size:76px;font-weight:950;color:var(--gold);margin:12px 0}
.small-note{color:var(--muted);font-size:14px;margin-top:18px}
.menu-home{position:fixed;top:18px;left:18px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:12px 17px;border-radius:13px;background:#162a45;color:var(--text);border:1px solid var(--border);text-decoration:none;font-weight:900;font-size:15px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.menu-home:hover{background:#21416b;transform:translateY(-2px)}
@media(max-width:600px){.app{padding:68px 10px 10px}.slide{min-height:calc(100vh - 115px);border-radius:20px;padding:20px}.option{font-size:16px;padding:14px}.topbar{font-size:14px}.menu-home{top:10px;left:10px;padding:10px 13px;font-size:14px}}
</style>
</head>
<body>
<a class="menu-home" href="index.html">← חזרה לתפריט</a>
<div class="app">
<div class="topbar"><div class="brand">אנטיביוטיקה</div><div class="score" id="scoreText">מוכן להתחלה</div></div>
<div class="progress"><div id="progressBar"></div></div>
<main class="slide" id="slide"></main>
</div>
<script>
const originalQuestions=[
{"q":"מהו תפקידם של הריבוזומים בתא חיידקי?","options":["אחראים על סינתזת חלבונים","מייצרים את דופן התא","מאחסנים את הכרומוזום החיידקי","מגנים מפני פאגוציטוזה"],"answer":0,"explanation":"הריבוזומים פזורים בציטופלזמה ואחראים על סינתזת חלבונים."},
{"q":"איזה מבנה חיידקי עשוי לשאת גנים לעמידות לאנטיביוטיקה?","options":["פלסמידים","קפסולה","קרום התא","ריבוזומים"],"answer":0,"explanation":"פלסמידים הם מולקולות DNA טבעתיות קטנות, ולעיתים נושאות גנים לעמידות."},
{"q":"מה מאפיין חיידק גראם-חיובי לעומת גראם-שלילי?","options":["שכבת פפטידוגליקן עבה וללא ממברנה חיצונית","שכבת פפטידוגליקן דקה עם ממברנה חיצונית","אין לו דופן תא","הוא תמיד אנאירובי"],"answer":0,"explanation":"במצגת גראם-חיובי מתואר עם שכבת פפטידוגליקן עבה וללא ממברנה חיצונית."},
{"q":"איזה מהבאים הוא דוגמה לחיידק גראם-שלילי לפי המצגת?","options":["E. coli","Strep. pneumoniae","Staph. aureus","כולם גראם-חיוביים"],"answer":0,"explanation":"E. coli ו-Pseudomonas מופיעים כדוגמאות לגראם-שליליים."},
{"q":"מה נכון לגבי חיידקים אירוביים?","options":["הם זקוקים לחמצן ומפיקים הרבה אנרגיה","אינם זקוקים לחמצן כלל","נמצאים רק במעי","אינם מסוגלים לגרום למחלה"],"answer":0,"explanation":"אירוביים זקוקים לחמצן, מפיקים הרבה אנרגיה ובעלי אנזימי הגנה."},
{"q":"איזה אזור מתאים במיוחד למחיה של חיידקים אנאירוביים לפי המצגת?","options":["מורסות ופצעים עמוקים","דם מחומצן היטב","ריאות בלבד","עור חשוף בלבד"],"answer":0,"explanation":"אנאירוביים משגשגים באזורים דלי חמצן, כגון מורסות, פצעים עמוקים, מעיים וחלל הפה."},
{"q":"מה מודד LD50?","options":["כמות החיידקים או הרעלן הדרושה לגרום למוות ב-50% מהנבדקים","מספר החיידקים הדרוש להדביק 50% מהנבדקים","מינון שגורם נזק לרקמות ב-50% מהנבדקים","משך הזמן עד תחילת השפעת אנטיביוטיקה"],"answer":0,"explanation":"LD50 הוא Lethal Dose – המינון הקשור לתמותה ב-50% מהנבדקים."},
{"q":"איזה מנגנון נזק חיידקי כולל פגיעה בפעילות הציטוסקלטון ותפקוד אברונים?","options":["שיבוש איתותים תאיים","הפרשת רעלנים","גרימת נזק ל-DNA","מניפולציה של מערכת החיסון"],"answer":0,"explanation":"שיבוש איתותים תאיים פוגע בפעילות הציטוסקלטון ובתפקוד אברונים כדי לאפשר פלישה והישרדות."},
{"q":"מה פירוש אנטיביוטיקה בעלת ספקטרום צר (Narrow)?","options":["פועלת על סוג מסוים של חיידקים","פועלת על רוב החיידקים גראם-חיוביים וגראם-שליליים","פועלת רק על וירוסים","פועלת רק במינון גבוה"],"answer":0,"explanation":"ספקטרום צר מיועד לטווח מצומצם יחסית; במצגת ניתן Penicillin G כדוגמה בעיקר נגד גראם-חיוביים."},
{"q":"איזו קבוצה מוזכרת כדוגמה לאנטיביוטיקה רחבת טווח?","options":["פלואורוקווינולונים","Penicillin G בלבד","Vancomycin בלבד","אין דוגמה במצגת"],"answer":0,"explanation":"במצגת פלואורוקווינולונים, טטרציקלינים וקרבפנמים מופיעים כדוגמאות לספקטרום רחב."},
{"q":"מהו מנגנון הפעולה של מעכבי סינתזת דופן התא?","options":["עיכוב סינתזת הדופן הגורם להרס פיזי של החיידק","חסימת קריאת RNA בריבוזום","עיכוב שחרור רעלנים בלבד","הגברת יצירת קפסולה"],"answer":0,"explanation":"עיכוב סינתזת דופן התא מחליש את החיידק ועלול לגרום להרסו; זהו אפקט בקטריוצידי."},
{"q":"איזו משפחת תרופות שייכת למעכבי סינתזת דופן התא לפי המצגת?","options":["צפלוספורינים","מאקרולידים","אמינוגליקוזידים","אף אחת מהן"],"answer":0,"explanation":"צפלוספורינים, קרבפנמים וגליקופפטידים מופיעים במצגת כמעכבי סינתזת דופן."},
{"q":"מה מאפיין Vancomycin לפי המצגת?","options":["פעיל נגד חיידקים גראם-חיוביים בלבד","פעיל בעיקר נגד גראם-שליליים","שייך למאקרולידים","ניתן רק דרך הפה"],"answer":0,"explanation":"Vancomycin הוא גליקופפטיד, ובמצגת מצוין שהוא פועל נגד גראם-חיוביים בלבד."},
{"q":"איזו תופעת לוואי בולטת מוזכרת ל-Vancomycin?","options":["נפרוטוקסיות ואוטוטוקסיות","עצירות בלבד","היפוגליקמיה","פגיעה בראייה בלבד"],"answer":0,"explanation":"במצגת מודגשות נפרוטוקסיות (כליות) ואוטוטוקסיות (שמיעה), ולכן נדרש ניטור רמות בדם."},
{"q":"מה נכון לגבי קרבפנמים לפי המצגת?","options":["בעלי טווח רחב וניתנים בעיקר בעירוי","בעלי טווח צר וניתנים רק מקומית","פועלים רק על גראם-חיוביים","אין נגדם מנגנוני עמידות"],"answer":0,"explanation":"קרבפנמים מתוארים כבעלי טווח רחב, עם עמידות לרוב הבטא-לקטמאזות, וניתנים בעיקר בעירוי."},
{"q":"על איזו יחידת מטרה פועלים מאקרולידים ואמינוגליקוזידים באופן כללי?","options":["הריבוזום וסינתזת החלבונים","דופן התא בלבד","הקפסולה","קרום התא האנושי"],"answer":0,"explanation":"שתי המשפחות שייכות למעכבי סינתזת חלבונים ופועלות בריבוזום החיידקי."},
{"q":"איזו תרופה היא מאקרוליד לפי המצגת?","options":["Azithromycin","Ceftriaxone","Vancomycin","Gentamicin"],"answer":0,"explanation":"Azithromycin, Clarithromycin ו-Roxithromycin מוזכרים כמאקרולידים."},
{"q":"איזו תופעת לוואי חשובה מוזכרת ל-Roxithromycin?","options":["סיכון להפרעות קצב","נפרוטוקסיות בלבד","ירידה קבועה בראייה","דימום חמור"],"answer":0,"explanation":"בטבלת האינדקס הקליני מצוין ל-Roxithromycin סיכון להפרעות קצב."},
{"q":"איזה מנגנון יכול להעביר פלסמידים נושאי גני עמידות ישירות בין שני חיידקים?","options":["קוניוגציה (Conjugation)","מוטציה אקראית","טרנסדוקציה","טרנספורמציה"],"answer":0,"explanation":"קוניוגציה היא העברה ישירה בין שני חיידקים באמצעות חיבור פיזי, ויכולה להעביר פלסמידים נושאי גני עמידות."},
{"q":"למה חשוב להשלים את קורס האנטיביוטיקה גם אם מרגישים שיפור מוקדם?","options":["כדי להפחית חזרת זיהום והתפתחות עמידות","כי האנטיביוטיקה מתחילה לעבוד רק ביום האחרון","כדי למנוע כל תופעת לוואי","אין לכך חשיבות לפי המצגת"],"answer":0,"explanation":"המצגת מדגישה שהקלה קלינית יכולה להופיע לפני חיסול מלא של הזיהום; השלמת הטיפול מסייעת למנוע חזרה והתפתחות עמידות."}
];
const QUESTIONS_PER_ROUND=20;
let questions=[],index=0,score=0,answered=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}

function startQuiz(){
  questions=JSON.parse(JSON.stringify(originalQuestions));
  shuffle(questions);
  questions=questions.slice(0,Math.min(QUESTIONS_PER_ROUND,questions.length));
  questions.forEach(q=>{const correct=q.options[q.answer];shuffle(q.options);q.answer=q.options.indexOf(correct)});
  index=0;score=0;answered=false;renderQuestion();
}

function renderStart(){
  progressBar.style.width='0%';
  scoreText.textContent='מוכן להתחלה';
  slide.innerHTML=`<section class="start"><div class="kicker">תרגול אינטראקטיבי</div><h1>אנטיביוטיקה</h1><p>20 שאלות אקראיות בכל סבב, עם משוב והסבר לאחר כל תשובה.</p><button class="ctrl primary" onclick="startQuiz()">התחלת התרגול</button><div class="small-note">${originalQuestions.length} שאלות במאגר • מבוסס על מצגת מבנה החיידק, סיווגים, מנגנוני פגיעה ומשפחות האנטיביוטיקה</div></section>`;
}

function renderQuestion(){
  answered=false;
  const q=questions[index],L=['א','ב','ג','ד'];
  scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;
  progressBar.style.width=`${index/questions.length*100}%`;
  slide.innerHTML=`<div class="kicker">שאלה ${index+1} מתוך ${questions.length}</div><h1>${q.q}</h1><div class="options">${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${L[i]}. ${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="ctrl secondary" onclick="renderStart()">התחלה מחדש</button><button class="ctrl primary" id="nextBtn" onclick="nextQuestion()" disabled>לשאלה הבאה</button></div>`;
}

function answer(choice){
  if(answered)return;
  answered=true;
  const q=questions[index],buttons=[...document.querySelectorAll('.option')];
  buttons.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct')});
  const ok=choice===q.answer;
  if(ok)score++; else buttons[choice].classList.add('wrong');
  const f=document.getElementById('feedback');
  f.style.display='block';f.classList.add(ok?'good':'bad');
  f.innerHTML=`<div class="feedback-title">${ok?'נכון מאוד!':'לא נכון'}</div><div>${q.explanation}</div>`;
  nextBtn.disabled=false;
  scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;
  progressBar.style.width=`${(index+1)/questions.length*100}%`;
}

function nextQuestion(){if(!answered)return;index++;index>=questions.length?renderFinish():renderQuestion()}

function renderFinish(){
  const p=Math.round(score/questions.length*100);
  const msg=p>=90?'מצוין! שליטה חזקה מאוד בחומר.':p>=75?'טוב מאוד! נשארה רק חזרה קצרה.':p>=60?'עבודה טובה, כדאי לחזור על הנושאים שבהם טעית.':'כדאי לעבור שוב על המצגת ולנסות מחדש.';
  scoreText.textContent='התרגול הסתיים';progressBar.style.width='100%';
  slide.innerHTML=`<section class="finish"><div class="kicker">סיום התרגול</div><h1>כל הכבוד!</h1><div class="big-score">${score}/${questions.length}</div><p>${msg}</p><button class="ctrl primary" onclick="startQuiz()">תרגול חדש</button></section>`;
}

document.addEventListener("keydown", function(e) {
  if (e.repeat) return;

  if (e.key === "Backspace") {
    e.preventDefault();
    window.location.href = "index.html";
    return;
  }

  if (index >= questions.length) {
    if (e.key === "Enter") {
      startQuiz();
    }
    return;
  }

  if (!answered) {
    if (e.key === "1") answer(0);
    else if (e.key === "2") answer(1);
    else if (e.key === "3") answer(2);
    else if (e.key === "4") answer(3);
  }
  else if (e.key === "Enter") {
    nextQuestion();
  }
});

renderStart();
</script>

</body>
</html>
