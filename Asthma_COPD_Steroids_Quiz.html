<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אסתמה, COPD וסטרואידים</title><style>
:root{--bg:#07111f;--card:#101f34;--text:#f7fbff;--muted:#a8bad0;--blue:#55c7ff;--gold:#ffbd59;--green:#2ecc71;--red:#ff6672;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:var(--bg)}.app{max-width:950px;margin:auto;padding:78px 20px 24px}.topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.brand{font-weight:900}.score{color:var(--muted);font-weight:700}.progress{height:10px;background:#081522;border-radius:999px;overflow:hidden;margin-bottom:18px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:.35s}.slide{min-height:620px;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:clamp(22px,5vw,46px);display:flex;flex-direction:column;justify-content:center}.kicker{color:var(--gold);font-weight:900;margin-bottom:12px}h1{font-size:clamp(25px,4vw,40px);line-height:1.45;margin:0 0 25px}.start,.finish{text-align:center}.start p,.finish p{color:var(--muted);font-size:18px;line-height:1.8}.options{display:grid;gap:13px}.option{border:1px solid var(--border);background:#0b192b;color:var(--text);padding:16px 18px;border-radius:15px;text-align:right;font-size:17px;cursor:pointer}.option.correct{border-color:var(--green);background:rgba(46,204,113,.17)}.option.wrong{border-color:var(--red);background:rgba(255,102,114,.17)}.feedback{display:none;margin-top:22px;border-radius:18px;padding:18px 20px;line-height:1.7;background:rgba(255,255,255,.06);border:1px solid var(--border)}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}button.ctrl{border:0;border-radius:13px;padding:13px 19px;font-size:16px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#06111e}.secondary{background:#162a45;color:var(--text)}button:disabled{opacity:.45}.big-score{font-size:76px;font-weight:950;color:var(--gold)}.menu-home{position:fixed;top:18px;left:18px;padding:12px 17px;border-radius:13px;background:#162a45;color:#fff;text-decoration:none;font-weight:900}@media(max-width:600px){.app{padding:68px 10px 10px}.slide{min-height:calc(100vh - 115px);border-radius:20px;padding:20px}}
</style></head><body><a class="menu-home" href="index.html">← חזרה לתפריט</a><div class="app"><div class="topbar"><div class="brand">אסתמה, COPD וסטרואידים</div><div class="score" id="scoreText">מוכן להתחלה</div></div><div class="progress"><div id="progressBar"></div></div><main class="slide" id="slide"></main></div><script>
const originalQuestions=[{"q": "מה עושה אגוניסט בטא 2 בדרכי הנשימה?", "options": ["מרחיב סימפונות", "מכווץ סימפונות", "מעלה הפרשת ריר", "חוסם H1"], "answer": 0, "explanation": "הפעלת β2 מרפה שריר חלק ומרחיבה את דרכי הנשימה."}, {"q": "מה פירוש SABA?", "options": ["Short Acting Beta Agonist", "Steroid Anti-Bronchial Agent", "Selective Allergy Blocker", "Systemic Airway Beta Antagonist"], "answer": 0, "explanation": "SABA הוא אגוניסט בטא קצר טווח."}, {"q": "מה פירוש LABA?", "options": ["Long Acting Beta Agonist", "Leukotriene Anti-Bronchial Agent", "Long Acting Beta Antagonist", "Local Airway Blocker"], "answer": 0, "explanation": "LABA הוא אגוניסט בטא ארוך טווח."}, {"q": "איזו תרופה היא דוגמה נפוצה ל-SABA?", "options": ["Salbutamol", "Mepolizumab", "Famotidine", "Ferrous sulfate"], "answer": 0, "explanation": "Salbutamol הוא SABA נפוץ."}, {"q": "מהי מטרת SABA?", "options": ["הקלה מהירה בהתקף", "טיפול אחזקה יחיד לאורך חודשים", "טיפול באנמיה", "מניעת ביוץ"], "answer": 0, "explanation": "SABA מתאים להקלה מהירה."}, {"q": "מהי מטרת LABA?", "options": ["הרחבת סימפונות ממושכת", "הקלה מיידית בלבד", "חסימת IgE", "דיכוי מח העצם"], "answer": 0, "explanation": "LABA נותן ברונכודילטציה ארוכת טווח."}, {"q": "מהו תפקיד הסטרואידים באסתמה?", "options": ["הפחתת דלקת בדרכי הנשימה", "הרחבת סימפונות מיידית בלבד", "העלאת רמות היסטמין", "חסימת ברזל"], "answer": 0, "explanation": "הסטרואידים הם טיפול אנטי-דלקתי."}, {"q": "למה טיפול מקומי בסטרואידים עדיף כשאפשר?", "options": ["פחות תופעות לוואי מערכתיות", "יותר דיכוי מערכתי", "פעולה איטית יותר תמיד", "אין צורך בהתאמת מינון"], "answer": 0, "explanation": "שאיפה או טיפול מקומי מצמצמים חשיפה מערכתית."}, {"q": "מהו עקרון Step-Down בסטרואידים?", "options": ["הפחתה הדרגתית למינון הנמוך היעיל", "הפסקה מיידית תמיד", "העלאה קבועה ללא ירידה", "מעבר לאנטיביוטיקה"], "answer": 0, "explanation": "מורידים בהדרגה כדי לשמור שליטה ולהפחית סיכון."}, {"q": "מדוע אין להפסיק סטרואידים סיסטמיים בבת אחת לאחר שימוש ממושך?", "options": ["סיכון לדיכוי ציר האדרנל", "סיכון לעליית ברזל", "כי הם ממכרים תמיד", "כי הם חוסמי H1"], "answer": 0, "explanation": "שימוש ממושך מדכא את ייצור הקורטיזול הטבעי."}, {"q": "מהי תופעת לוואי מטבולית אפשרית של סטרואידים?", "options": ["עלייה בסוכר ובמשקל", "היפוגליקמיה קבועה", "ירידה חדה בכולסטרול", "אנמיה מחוסר ברזל"], "answer": 0, "explanation": "המצגת מדגישה עלייה במשקל ובסוכר."}, {"q": "מהי תופעת לוואי בעצם בשימוש כרוני בסטרואידים?", "options": ["אוסטאופורוזיס", "צמיחת עצם מואצת", "עודף ברזל", "הגדלת MCV"], "answer": 0, "explanation": "סטרואידים כרוניים מעלים סיכון לאובדן עצם."}, {"q": "איזה טיפול מגן על העצם בשימוש כרוני בסטרואידים?", "options": ["סידן וויטמין D", "ויטמין C בלבד", "אנטיהיסטמין", "Montelukast"], "answer": 0, "explanation": "המצגת מציינת סידן וויטמין D."}, {"q": "מה ההבדל העיקרי בין אסתמה ל-COPD?", "options": ["אסתמה לרוב הפיכה יותר, COPD פחות הפיך", "COPD תמיד בילדים", "אסתמה אינה דלקתית", "אין הבדל"], "answer": 0, "explanation": "במצגת אסתמה מתוארת כחסימה הפיכה יותר."}, {"q": "מהו גורם הסיכון המרכזי ל-COPD?", "options": ["עישון", "חוסר B12", "אלרגיה למזון בלבד", "שימוש ב-PPI"], "answer": 0, "explanation": "המצגת מציינת שעישון אחראי לרוב המקרים."}, {"q": "מהם שני הפנים העיקריים של COPD?", "options": ["ברונכיטיס כרונית ואמפיזמה", "אסתמה ואנפילקסיס", "נזלת ואורטיקריה", "אנמיה וחסר ברזל"], "answer": 0, "explanation": "COPD כולל ברונכיטיס כרונית ואמפיזמה."}, {"q": "מה קורה באמפיזמה?", "options": ["הרס נאדיות ואובדן גמישות", "ייצור יתר של RBC", "היצרות כלי דם בלבד", "עליית IgE בלבד"], "answer": 0, "explanation": "הרס דפנות הנאדיות מפחית שטח חילוף גזים."}, {"q": "מהי מטרת טיפול משותפת באסתמה וב-COPD?", "options": ["הקלה בקוצר נשימה ושיפור תפקוד", "העלאת היסטמין", "מניעת ספיגת ברזל", "דיכוי מח עצם"], "answer": 0, "explanation": "בשתי המחלות רוצים להפחית תסמינים ולשפר נשימה."}, {"q": "איזו תרופה אינה נחשבת SABA לפי המצגת?", "options": ["Mepolizumab", "Salbutamol", "Terbutaline", "תרופה שמסתיימת לרוב ב-ol"], "answer": 0, "explanation": "Mepolizumab היא תרופה ביולוגית ולא SABA."}, {"q": "מהו הסיכון בשימוש יתר בסטרואידים?", "options": ["עלייה משמעותית בתמותה ותופעות מערכתיות", "ריפוי מלא של COPD", "הפחתת כל סיכון", "אין תופעות לוואי"], "answer": 0, "explanation": "המצגת מזהירה משימוש כרוני ולא מבוקר."}];let questions=[],index=0,score=0,answered=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function startQuiz(){questions=JSON.parse(JSON.stringify(originalQuestions));shuffle(questions);questions.forEach(q=>{const c=q.options[q.answer];shuffle(q.options);q.answer=q.options.indexOf(c)});index=0;score=0;renderQuestion()}
function renderStart(){progressBar.style.width='0%';scoreText.textContent='מוכן להתחלה';slide.innerHTML=`<section class="start"><div class="kicker">תרגול אינטראקטיבי</div><h1>אסתמה, COPD וסטרואידים</h1><p>20 שאלות ממוקדות ב-SABA, LABA, סטרואידים וטיפול נשימתי.</p><button class="ctrl primary" onclick="startQuiz()">התחלת התרגול</button></section>`}
function renderQuestion(){answered=false;const q=questions[index],L=['א','ב','ג','ד'];scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;progressBar.style.width=`${index/questions.length*100}%`;slide.innerHTML=`<div class="kicker">שאלה ${index+1} מתוך ${questions.length}</div><h1>${q.q}</h1><div class="options">${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${L[i]}. ${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="ctrl secondary" onclick="renderStart()">התחלה מחדש</button><button class="ctrl primary" id="nextBtn" onclick="nextQuestion()" disabled>לשאלה הבאה</button></div>`}
function answer(choice){if(answered)return;answered=true;const q=questions[index],bs=[...document.querySelectorAll('.option')];bs.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct')});const ok=choice===q.answer;if(ok)score++;else bs[choice].classList.add('wrong');feedback.style.display='block';feedback.innerHTML=`<strong>${ok?'נכון מאוד!':'לא נכון'}</strong><br>${q.explanation}`;nextBtn.disabled=false;scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;progressBar.style.width=`${(index+1)/questions.length*100}%`}
function nextQuestion(){index++;index>=questions.length?finish():renderQuestion()}
function finish(){scoreText.textContent='התרגול הסתיים';progressBar.style.width='100%';slide.innerHTML=`<section class="finish"><div class="kicker">סיום התרגול</div><h1>כל הכבוד!</h1><div class="big-score">${score}/${questions.length}</div><button class="ctrl primary" onclick="startQuiz()">תרגול חדש</button></section>`}

document.addEventListener("keydown", function(e) {
  if (e.repeat) return;

  // Backspace = الرجوع للصفحة الرئيسية
  if (e.key === "Backspace") {
    e.preventDefault();
    window.location.href = "index.html";
    return;
  }

  // إذا انتهى الامتحان → Enter يبدأ امتحان جديد
  if (index >= questions.length) {
    if (e.key === "Enter") {
      startQuiz();
    }
    return;
  }

  // أثناء السؤال → 1-4 لاختيار الإجابة
  if (!answered) {
    if (e.key === "1") answer(0);
    else if (e.key === "2") answer(1);
    else if (e.key === "3") answer(2);
    else if (e.key === "4") answer(3);
  }

  // بعد الإجابة → Enter للسؤال التالي
  else if (e.key === "Enter") {
    nextQuestion();
  }
});

renderStart();
</script>
