<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אנמיה וטיפול בברזל</title><style>
:root{--bg:#07111f;--card:#101f34;--text:#f7fbff;--muted:#a8bad0;--blue:#55c7ff;--gold:#ffbd59;--green:#2ecc71;--red:#ff6672;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:var(--bg)}.app{max-width:950px;margin:auto;padding:78px 20px 24px}.topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.brand{font-weight:900}.score{color:var(--muted);font-weight:700}.progress{height:10px;background:#081522;border-radius:999px;overflow:hidden;margin-bottom:18px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:.35s}.slide{min-height:620px;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:clamp(22px,5vw,46px);display:flex;flex-direction:column;justify-content:center}.kicker{color:var(--gold);font-weight:900;margin-bottom:12px}h1{font-size:clamp(25px,4vw,40px);line-height:1.45;margin:0 0 25px}.start,.finish{text-align:center}.start p,.finish p{color:var(--muted);font-size:18px;line-height:1.8}.options{display:grid;gap:13px}.option{border:1px solid var(--border);background:#0b192b;color:var(--text);padding:16px 18px;border-radius:15px;text-align:right;font-size:17px;cursor:pointer}.option.correct{border-color:var(--green);background:rgba(46,204,113,.17)}.option.wrong{border-color:var(--red);background:rgba(255,102,114,.17)}.feedback{display:none;margin-top:22px;border-radius:18px;padding:18px 20px;line-height:1.7;background:rgba(255,255,255,.06);border:1px solid var(--border)}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}button.ctrl{border:0;border-radius:13px;padding:13px 19px;font-size:16px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#06111e}.secondary{background:#162a45;color:var(--text)}button:disabled{opacity:.45}.big-score{font-size:76px;font-weight:950;color:var(--gold)}.menu-home{position:fixed;top:18px;left:18px;padding:12px 17px;border-radius:13px;background:#162a45;color:#fff;text-decoration:none;font-weight:900}@media(max-width:600px){.app{padding:68px 10px 10px}.slide{min-height:calc(100vh - 115px);border-radius:20px;padding:20px}}
</style></head><body><a class="menu-home" href="index.html">← חזרה לתפריט</a><div class="app"><div class="topbar"><div class="brand">אנמיה וטיפול בברזל</div><div class="score" id="scoreText">מוכן להתחלה</div></div><div class="progress"><div id="progressBar"></div></div><main class="slide" id="slide"></main></div><script>
const originalQuestions=[{"q": "מהו התפקיד העיקרי של המוגלובין?", "options": ["נשיאת חמצן", "פירוק גלוקוז", "ייצור נוגדנים", "מניעת ביוץ"], "answer": 0, "explanation": "המוגלובין קושר חמצן ומוביל אותו לרקמות."}, {"q": "מה משמעות MCV נמוך?", "options": ["אנמיה מיקרוציטית", "אנמיה מקרוציטית", "אין אנמיה", "עודף B12"], "answer": 0, "explanation": "MCV נמוך מתאים לרוב לאנמיה מיקרוציטית."}, {"q": "מה משמעות MCV גבוה?", "options": ["אנמיה מקרוציטית", "אנמיה מיקרוציטית", "חסר ברזל בלבד", "אין שינוי בכדוריות"], "answer": 0, "explanation": "MCV גבוה מתאים לרוב לחסר B12 או חומצה פולית."}, {"q": "מהו הסדר האופייני בחסר ברזל?", "options": ["תחילה ירידת Ferritin ואחר כך ירידת HGB", "תחילה עליית HGB", "אין שינוי במחסנים", "רק עליית MCV"], "answer": 0, "explanation": "מחסני הברזל יורדים לפני ההמוגלובין."}, {"q": "מהו טיפול בסיסי באנמיה מחוסר ברזל?", "options": ["תכשירי ברזל", "Montelukast", "Epinephrine", "LABA"], "answer": 0, "explanation": "משלימים את החסר באמצעות תכשירי ברזל."}, {"q": "איזה תכשיר ברזל מופיע כיעיל וזול?", "options": ["Ferrous sulfate", "Famotidine", "Fexofenadine", "Levonorgestrel"], "answer": 0, "explanation": "Ferrous sulfate הוא תכשיר נפוץ ויעיל."}, {"q": "מהי תופעת לוואי שכיחה של Ferrous sulfate?", "options": ["תופעות במערכת העיכול ועצירות", "התקפי שינה", "היפוגליקמיה", "דיכוי נשימתי"], "answer": 0, "explanation": "ברזל פומי עלול לגרום לבחילה ועצירות."}, {"q": "איזה תכשיר עשוי להיות נסבל יותר אך מכיל פחות ברזל אלמנטרי?", "options": ["Ferrous gluconate", "Epinephrine", "Corticosteroid", "Ondansetron"], "answer": 0, "explanation": "Ferrous gluconate עשוי לגרום לפחות תופעות GI."}, {"q": "איזה תכשיר ברזל מופיע כמכיל ריכוז גבוה יחסית?", "options": ["Ferrous fumarate", "Ferrous gluconate", "Ferric salts בלבד", "Famotidine"], "answer": 0, "explanation": "Ferrous fumarate מתואר כבעל תכולת ברזל גבוהה."}, {"q": "מה היתרון של Ferrous bisglycinate?", "options": ["סבילות טובה יחסית", "אסור בהריון תמיד", "אינו מכיל ברזל", "גורם תמיד לעצירות קשה"], "answer": 0, "explanation": "המצגת מציינת סבילות טובה."}, {"q": "מתי נשקל ברזל תוך-ורידי?", "options": ["כשברזל פומי אינו מתאים או אינו נסבל", "בכל חסר קל", "רק לאחר נטילת H1", "רק בילדים בריאים"], "answer": 0, "explanation": "ברזל IV נשקל כשאין תגובה או יש אי סבילות."}, {"q": "מהו טיפול חירום באנמיה קשה ומסכנת חיים?", "options": ["מתן דם", "תוסף סידן", "Montelukast", "PPI"], "answer": 0, "explanation": "במצבים חריפים ניתן עירוי דם."}, {"q": "מהו טיפול באנמיה מחסר B12?", "options": ["השלמת B12", "השלמת ברזל בלבד", "SABA", "סטרואידים מקומיים"], "answer": 0, "explanation": "יש להשלים את החומר החסר."}, {"q": "מהו טיפול באנמיה מחסר חומצה פולית?", "options": ["השלמת חומצה פולית", "Epinephrine", "LABA", "חוסם H1"], "answer": 0, "explanation": "הטיפול הוא השלמת פולאט."}, {"q": "איזו סכנה קיימת בחסר B12 ממושך?", "options": ["פגיעה נוירולוגית", "רק פריחה", "רק עצירות", "אין כל סיכון"], "answer": 0, "explanation": "חסר B12 עלול לגרום לפגיעה נוירולוגית."}, {"q": "מה בודקים במעקב אחר טיפול בברזל?", "options": ["HGB ומדדי דם ומחסני ברזל", "רק לחץ דם", "רק גלוקוז", "רק IgE"], "answer": 0, "explanation": "המעקב כולל בדיקות דם חוזרות."}, {"q": "למה ממשיכים לעיתים טיפול בברזל גם לאחר שיפור HGB?", "options": ["כדי למלא מחסנים", "כדי להוריד B12", "כדי למנוע ביוץ", "כדי להעלות IgE"], "answer": 0, "explanation": "שיפור HGB אינו אומר שהמחסנים התמלאו."}, {"q": "איזה תוסף חשוב סביב הריון למניעת מומים בצינור העצבי?", "options": ["חומצה פולית", "Montelukast", "Fexofenadine", "Famotidine"], "answer": 0, "explanation": "חומצה פולית חשובה למניעת מומים בצינור העצבי."}, {"q": "איזו בדיקה משקפת את אחוז נפח הכדוריות האדומות בדם?", "options": ["HCT", "IgE", "FSH", "LH"], "answer": 0, "explanation": "Hematocrit הוא אחוז נפח כדוריות הדם האדומות."}, {"q": "איזו בדיקה משקפת את מספר כדוריות הדם האדומות?", "options": ["RBC", "HGB", "MCV בלבד", "IgE"], "answer": 0, "explanation": "RBC הוא ספירת כדוריות הדם האדומות."}];let questions=[],index=0,score=0,answered=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function startQuiz(){questions=JSON.parse(JSON.stringify(originalQuestions));shuffle(questions);questions.forEach(q=>{const c=q.options[q.answer];shuffle(q.options);q.answer=q.options.indexOf(c)});index=0;score=0;renderQuestion()}
function renderStart(){progressBar.style.width='0%';scoreText.textContent='מוכן להתחלה';slide.innerHTML=`<section class="start"><div class="kicker">תרגול אינטראקטיבי</div><h1>אנמיה וטיפול בברזל</h1><p>20 שאלות על סוגי אנמיה, תכשירי ברזל, B12 וחומצה פולית.</p><button class="ctrl primary" onclick="startQuiz()">התחלת התרגול</button></section>`}
function renderQuestion(){answered=false;const q=questions[index],L=['א','ב','ג','ד'];scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;progressBar.style.width=`${index/questions.length*100}%`;slide.innerHTML=`<div class="kicker">שאלה ${index+1} מתוך ${questions.length}</div><h1>${q.q}</h1><div class="options">${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${L[i]}. ${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="ctrl secondary" onclick="renderStart()">התחלה מחדש</button><button class="ctrl primary" id="nextBtn" onclick="nextQuestion()" disabled>לשאלה הבאה</button></div>`}
function answer(choice){if(answered)return;answered=true;const q=questions[index],bs=[...document.querySelectorAll('.option')];bs.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct')});const ok=choice===q.answer;if(ok)score++;else bs[choice].classList.add('wrong');feedback.style.display='block';feedback.innerHTML=`<strong>${ok?'נכון מאוד!':'לא נכון'}</strong><br>${q.explanation}`;nextBtn.disabled=false;scoreText.textContent=`שאלה ${index+1} מתוך ${questions.length} | ציון: ${score}`;progressBar.style.width=`${(index+1)/questions.length*100}%`}
function nextQuestion(){index++;index>=questions.length?finish():renderQuestion()}
function finish(){scoreText.textContent='התרגול הסתיים';progressBar.style.width='100%';slide.innerHTML=`<section class="finish"><div class="kicker">סיום התרגול</div><h1>כל הכבוד!</h1><div class="big-score">${score}/${questions.length}</div><button class="ctrl primary" onclick="startQuiz()">תרגול חדש</button></section>`}

document.addEventListener("keydown", function(e) {
  if (e.repeat) return;

  // Backspace = الرجوع للصفحة الرئيسية
  if (e.key === "Backspace") {
    e.preventDefault();
    window.location.href = "index.html";
    return;
  }

  // إذا انتهى الامتحان → Enter يبدأ امتحان جديد
  if (index >= questions.length) {
    if (e.key === "Enter") {
      startQuiz();
    }
    return;
  }

  // أثناء السؤال → 1-4 لاختيار الإجابة
  if (!answered) {
    if (e.key === "1") answer(0);
    else if (e.key === "2") answer(1);
    else if (e.key === "3") answer(2);
    else if (e.key === "4") answer(3);
  }

  // بعد الإجابة → Enter للسؤال التالي
  else if (e.key === "Enter") {
    nextQuestion();
  }
}); 

renderStart();
</script></body></html>
