<html lang="he" dir="rtl">
<head>

<title>חידון אינטראקטיבי – מערכת העצבים האוטונומית</title>
<style>
:root{--bg:#07111f;--card:#101f34;--text:#f7fbff;--muted:#a8bad0;--blue:#55c7ff;--gold:#ffbd59;--green:#2ecc71;--red:#ff6672;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(85,199,255,.15),transparent 28%),radial-gradient(circle at 90% 90%,rgba(255,189,89,.12),transparent 28%),var(--bg);min-height:100vh}
.app{max-width:950px;margin:auto;padding:20px} .topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px} .brand{font-weight:900;font-size:18px} .score{color:var(--muted);font-weight:700}
.progress{height:10px;background:#081522;border-radius:999px;overflow:hidden;margin-bottom:18px} .progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:.35s}
.slide{min-height:620px;background:linear-gradient(145deg,rgba(16,31,52,.98),rgba(13,25,43,.98));border:1px solid var(--border);border-radius:28px;padding:clamp(22px,5vw,46px);box-shadow:0 28px 80px rgba(0,0,0,.38);display:flex;flex-direction:column;justify-content:center}
.kicker{color:var(--gold);font-weight:900;margin-bottom:12px} h1{font-size:clamp(25px,4vw,40px);line-height:1.45;margin:0 0 25px} .options{display:grid;gap:13px}
.option{border:1px solid var(--border);background:#0b192b;color:var(--text);padding:16px 18px;border-radius:15px;text-align:right;font-size:17px;line-height:1.5;cursor:pointer;transition:.2s}
.option:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue);background:#10223b} .option.correct{border-color:var(--green);background:rgba(46,204,113,.17)} .option.wrong{border-color:var(--red);background:rgba(255,102,114,.17)} .option:disabled{cursor:default}
.feedback{display:none;margin-top:22px;border-radius:18px;padding:18px 20px;line-height:1.7;background:rgba(255,255,255,.06);border:1px solid var(--border)} .feedback.good{border-color:rgba(46,204,113,.55)} .feedback.bad{border-color:rgba(255,102,114,.55)} .feedback-title{font-weight:900;font-size:19px;margin-bottom:6px}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap} button.ctrl{border:0;border-radius:13px;padding:13px 19px;font-size:16px;font-weight:900;cursor:pointer} .primary{background:var(--blue);color:#06111e} .secondary{background:#162a45;color:var(--text);border:1px solid var(--border)!important} button.ctrl:disabled{opacity:.45;cursor:not-allowed}
.start,.finish{text-align:center} .start h1,.finish h1{font-size:clamp(32px,6vw,58px)} .start p,.finish p{color:var(--muted);font-size:18px;line-height:1.8} .big-score{font-size:76px;font-weight:950;color:var(--gold);margin:12px 0} .small-note{color:var(--muted);font-size:14px;margin-top:18px}
@media(max-width:600px){.app{padding:10px}.slide{min-height:calc(100vh - 80px);border-radius:20px;padding:20px}.option{font-size:16px;padding:14px}.topbar{font-size:14px}}
</style></head>
<body><div class="app"><div class="topbar"><div class="brand">חידון אינטראקטיבי – מערכת העצבים האוטונומית</div><div class="score" id="scoreText">מוכן להתחלה</div></div><div class="progress"><div id="progressBar"></div></div><main class="slide" id="slide"></main></div>
<script>
const originalQuestions=[{"q": "מהו תפקידה המרכזי של מערכת העצבים המרכזית?", "options": ["להעביר הורמונים דרך הדם בלבד", "לעבד מידע ולתאם תגובות של הגוף", "לייצר תאי דם אדומים", "לפרק מזון במערכת העיכול"], "answer": 1, "explanation": "מערכת העצבים המרכזית, הכוללת את המוח וחוט השדרה, אחראית לעיבוד מידע ולתיאום תגובות."}, {"q": "אילו מבנים נכללים במערכת העצבים המרכזית?", "options": ["המוח וחוט השדרה", "העצבים ההיקפיים בלבד", "הלב וכלי הדם", "הגנגליונים בלבד"], "answer": 0, "explanation": "מערכת העצבים המרכזית מורכבת מהמוח ומחוט השדרה."}, {"q": "מה כוללת מערכת העצבים ההיקפית?", "options": ["רק את המוח", "רק את חוט השדרה", "את העצבים המחברים בין מערכת העצבים המרכזית לשאר הגוף", "רק את מערכת הנשימה"], "answer": 2, "explanation": "מערכת העצבים ההיקפית כוללת את העצבים שמחוץ למוח ולחוט השדרה ומקשרת אותם לגוף."}, {"q": "איזו מערכת שולטת בעיקר בפעולות רצוניות של שרירי השלד?", "options": ["המערכת הסומטית", "המערכת הפאראסימפתטית", "המערכת האנדוקרינית", "המערכת הסימפתטית בלבד"], "answer": 0, "explanation": "המערכת הסומטית שולטת בעיקר בתנועות רצוניות של שרירי השלד."}, {"q": "מהו תפקידה הכללי של מערכת העצבים האוטונומית?", "options": ["שליטה בפעולות רצוניות בלבד", "שליטה בתפקודים לא-רצוניים של איברים פנימיים", "יצירת עצמות", "ייצור נוגדנים"], "answer": 1, "explanation": "מערכת העצבים האוטונומית מווסתת תפקודים לא-רצוניים כמו קצב לב, נשימה ועיכול."}, {"q": "איזו תגובה אופיינית למערכת הסימפתטית?", "options": ["מנוחה ועיכול", "הילחם או ברח", "שינה עמוקה בלבד", "ירידה כללית בערנות"], "answer": 1, "explanation": "המערכת הסימפתטית מכינה את הגוף למצבי מאמץ או סכנה – הילחם או ברח."}, {"q": "איזו תגובה אופיינית למערכת הפאראסימפתטית?", "options": ["הילחם או ברח", "הגברת מתח שרירי השלד בלבד", "מנוחה ועיכול", "הפסקת פעילות מערכת העיכול"], "answer": 2, "explanation": "המערכת הפאראסימפתטית מקדמת מנוחה, עיכול ושימור אנרגיה."}, {"q": "מה פירוש המושג הומאוסטזיס בהקשר של המערכת האוטונומית?", "options": ["שמירה על איזון פנימי בגוף", "הפסקת כל הפעילות העצבית", "עלייה קבועה בלחץ הדם", "ייצור הורמונים בלבד"], "answer": 0, "explanation": "שתי זרועות מערכת העצבים האוטונומית פועלות יחד לשמירה על איזון פנימי – הומאוסטזיס."}, {"q": "כיצד משפיעה המערכת הסימפתטית על הלב בדרך כלל?", "options": ["מאטה את קצב הלב", "מגבירה קצב ועוצמת התכווצות", "עוצרת את זרימת הדם", "אינה משפיעה על הלב"], "answer": 1, "explanation": "המערכת הסימפתטית מגבירה את קצב הלב ואת עוצמת ההתכווצות."}, {"q": "כיצד משפיעה המערכת הפאראסימפתטית על הלב בדרך כלל?", "options": ["מגבירה את קצב הלב מאוד", "מאטה את קצב הלב", "מגדילה את נפח הריאות", "גורמת להפרשת אדרנלין"], "answer": 1, "explanation": "המערכת הפאראסימפתטית, בעיקר דרך עצב הואגוס, מאטה את קצב הלב."}, {"q": "מהי השפעת המערכת הסימפתטית על דרכי הנשימה?", "options": ["כיווץ הסמפונות", "הרחבת הסמפונות", "הפסקת הנשימה", "אין כל השפעה"], "answer": 1, "explanation": "במצבי מאמץ המערכת הסימפתטית מרחיבה את דרכי הנשימה כדי לשפר כניסת אוויר."}, {"q": "מהי השפעת המערכת הפאראסימפתטית על מערכת העיכול?", "options": ["עיכוב תנועתיות והפרשות", "הגברת תנועתיות והפרשות", "הפסקת ספיגת המזון", "פירוק שרירי המעי"], "answer": 1, "explanation": "המערכת הפאראסימפתטית מעודדת עיכול, תנועתיות והפרשות."}, {"q": "מהי השפעת המערכת הסימפתטית על מערכת העיכול?", "options": ["הגברת הפרשות ותנועתיות", "עיכוב הפרשות ותנועתיות", "אין השפעה", "ייצור אינסולין בלבד"], "answer": 1, "explanation": "במצבי הילחם או ברח המערכת הסימפתטית מפחיתה פעילות עיכול."}, {"q": "מהי השפעת המערכת הפאראסימפתטית על שלפוחית השתן?", "options": ["עידוד התרוקנות", "עיכוב התרוקנות", "הפסקת יצירת שתן", "הגברת אדרנלין"], "answer": 0, "explanation": "המערכת הפאראסימפתטית מסייעת בכיווץ שריר השלפוחית ובהתרוקנות."}, {"q": "מהי השפעת המערכת הסימפתטית על שלפוחית השתן?", "options": ["עידוד מיידי של התרוקנות", "עיכוב התרוקנות", "הגברת ספיגת מים בכליה בלבד", "אין השפעה עצבית"], "answer": 1, "explanation": "המערכת הסימפתטית תומכת באגירת שתן ומעכבת התרוקנות."}, {"q": "איזו תגובה מתרחשת באישון בעקבות הפעלה סימפתטית?", "options": ["מיוזיס (כיווץ האישון)", "מידריאזיס (הרחבת האישון)", "הפסקת תגובת האישון", "שינוי צבע הקשתית"], "a ", "חסרי אקסון", "מגיעים לשרירי שלד בלבד"], "answer": 1, "explanation": "הגנגליונים הפאראסימפתטיים קרובים לאיבר המטרה ולכן הסיב הפרה-גנגליוני ארוך."}, {"q": "מהו יחס הפיצול האופייני במערכת הסימפתטית לפי המצגת?", "options": ["1:1 בלבד", "כ-1:20", "20:1 לכיוון הפוך", "אין פיצול"], "answer": 1, "explanation": "לנוירון פרה-גנגליוני סימפתטי יכולה להיות הסתעפות לכ-20 נוירונים פוסט-גנגליוניים."}, {"q": "מהו יחס הפיצול האופייני במערכת הפאראסימפתטית?", "options": ["פיזור רחב מאוד של 1:20", "יחס ממוקד יותר, לעיתים קרובות קרוב ל-1:1", "אין נוירון פוסט-גנגליוני", "1:100"], "answer": 1, "explanation": "המערכת הפאראסימפתטית פועלת באופן ממוקד יותר ופחות מפושט."}, {"q": "איזה נוירוטרנסמיטר משתחרר מכל הסיבים הפרה-גנגליוניים במערכת האוטונומית?", "options": ["נוראדרנלין", "אצטילכולין (אצטילכולין)", "דופמין", "סרוטונין"], "answer": 1, "explanation": "גם במערכת הסימפתטית וגם בפאראסימפתטית, הסיב הפרה-גנגליוני משחרר אצטילכולין."}, {"q": "לאיזה סוג קולטן נקשר אצטילכולין בגנגליונים האוטונומיים?", "options": ["קולטן מוסקריני", "קולטן ניקוטיני", "קולטן אלפא-1", "קולטן בטא-2"], "answer": 1, "explanation": "בגנגליונים האוטונומיים אצטילכולין נקשר לקולטנים ניקוטיניים."}, {"q": "איזה נוירוטרנסמיטר משתחרר בדרך כלל מהסיב הפוסט-גנגליוני הפאראסימפתטי?", "options": ["אצטילכולין", "נוראדרנלין", "אדרנלין", "דופמין"], "answer": 0, "explanation": "הסיבים הפוסט-גנגליוניים הפאראסימפתטיים משחררים אצטילכולין."}, {"q": "לאילו קולטנים נקשר אצטילכולין באיבר המטרה של המערכת הפאראסימפתטית?", "options": ["קולטנים ניקוטיניים בלבד", "קולטנים מוסקריניים", "קולטני אלפא בלבד", "קולטני בטא בלבד"], "answer": 1, "explanation": "באיבר המטרה הפאראסימפתטי אצטילכולין נקשר לקולטנים מוסקריניים."}, {"q": "איזה נוירוטרנסמיטר משתחרר בדרך כלל מהסיב הפוסט-גנגליוני הסימפתטי?", "options": ["אצטילכולין תמיד", "נוראדרנלין (נוראדרנלין)", "גלוטמט", "גאבא"], "answer": 1, "explanation": "ברוב האיברים הסיב הפוסט-גנגליוני הסימפתטי משחרר נוראדרנלין."}, {"q": "מהו החריג הסימפתטי החשוב בבלוטות הזיעה?", "options": ["הן מקבלות אצטילכולין ונקשרות לקו
